<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>NoorPath — Islamic Kids Learning Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#16335E;--g2:#2C5C9E;--gp:#E8EEF8;
  --gold:#C9860A;--gl:#F0C040;--gld:#FEF9E7;
  --pur:#6B3FA0;--purp:#EDE7F6;
  --sky:#1565C0;--skyp:#E3F2FD;
  --rose:#C62828;--rosep:#FFEBEE;
  --night:#060A14;--cream:#FDFCF7;
  --text:#1A2233;--soft:#7C8FB0;
  --r:18px;--sh:0 4px 24px rgba(44,92,158,0.13);--shl:0 12px 48px rgba(44,92,158,0.18);
}
html,body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;overflow-x:hidden}

/* NAV */
.nav{background:linear-gradient(135deg,var(--g),#0d3520);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,0.2)}
.nav-logo{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none}
.nav-mark{width:36px;height:36px;background:rgba(255,255,255,0.15);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.nav-text{color:#fff;font-size:17px;font-weight:900}
.nav-sub{color:var(--gl);font-size:9px;font-weight:700;letter-spacing:1px}
.nav-right{display:flex;align-items:center;gap:8px}
.nav-btn{border:none;border-radius:10px;padding:7px 14px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;cursor:pointer;transition:all 0.2s}
.nav-plan{background:var(--gl);color:var(--night);font-size:11px}
.nav-logout{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.8)}
.nav-logout:hover{background:rgba(255,255,255,0.2)}
.nav-tabs{display:flex;gap:3px}
.nav-tab{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,0.08);border:none;border-radius:10px;color:rgba(255,255,255,0.75);padding:5px 10px;font-size:10px;font-family:'Nunito',sans-serif;font-weight:700;cursor:pointer;transition:all 0.2s;min-width:44px}
.nav-tab:hover,.nav-tab.active{background:rgba(255,255,255,0.2);color:#fff}
.nav-tab.active{background:var(--gl);color:var(--night)}

/* AUTH */
.auth-overlay{position:fixed;inset:0;background:rgba(13,31,20,0.85);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.auth-card{background:#fff;border-radius:28px;padding:40px;max-width:440px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,0.4);text-align:center}
.auth-logo{font-size:48px;margin-bottom:10px}
.auth-title{font-size:24px;font-weight:900;color:var(--text);margin-bottom:6px}
.auth-sub{font-size:14px;color:var(--soft);margin-bottom:28px;line-height:1.6}
.auth-tabs{display:flex;background:#f5f5f0;border-radius:14px;padding:4px;margin-bottom:24px}
.auth-tab{flex:1;padding:10px;border:none;border-radius:10px;font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;cursor:pointer;background:transparent;color:var(--soft);transition:all 0.2s}
.auth-tab.active{background:#fff;color:var(--g);box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.auth-input{width:100%;border:2px solid #e8e8e0;border-radius:12px;padding:12px 16px;font-family:'Nunito',sans-serif;font-size:14px;margin-bottom:12px;outline:none;transition:border 0.2s}
.auth-input:focus{border-color:var(--g)}
.auth-submit{width:100%;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border:none;border-radius:14px;padding:14px;font-family:'Nunito',sans-serif;font-weight:900;font-size:16px;cursor:pointer;margin-top:4px;transition:all 0.2s}
.auth-submit:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(44,92,158,0.3)}
.auth-divider{color:var(--soft);font-size:13px;margin:16px 0}
.auth-google{width:100%;background:#fff;color:var(--text);border:2px solid #e0e0e0;border-radius:12px;padding:12px;font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.2s}
.auth-google:hover{border-color:#bbb;background:#f8f8f8}
.auth-note{font-size:12px;color:var(--soft);margin-top:16px;line-height:1.6}

/* UPGRADE GATE */
.gate-overlay{position:fixed;inset:0;background:rgba(13,31,20,0.9);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.gate-card{background:#fff;border-radius:28px;padding:36px;max-width:420px;width:100%;text-align:center}
.gate-icon{font-size:56px;margin-bottom:12px}
.gate-title{font-size:22px;font-weight:900;color:var(--text);margin-bottom:8px}
.gate-sub{font-size:14px;color:var(--soft);margin-bottom:24px;line-height:1.6}
.gate-features{text-align:left;background:var(--gp);border-radius:14px;padding:16px;margin-bottom:24px}
.gate-feat{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--g);margin-bottom:8px}
.gate-feat:last-child{margin-bottom:0}
.gate-price{font-size:28px;font-weight:900;color:var(--g);margin-bottom:6px}
.gate-period{font-size:13px;color:var(--soft);margin-bottom:20px}
.gate-btn{width:100%;background:linear-gradient(135deg,var(--gl),#E6A010);color:var(--night);border:none;border-radius:14px;padding:14px;font-family:'Nunito',sans-serif;font-weight:900;font-size:16px;cursor:pointer;margin-bottom:10px}
.gate-skip{background:none;border:none;color:var(--soft);font-family:'Nunito',sans-serif;font-size:13px;cursor:pointer;text-decoration:underline}

/* HERO */
.hero{background:linear-gradient(160deg,var(--night),#0f2d1a);padding:44px 20px 56px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 70% 50%,rgba(240,192,64,0.08),transparent 60%)}
.hero-bismillah{font-family:'Amiri',serif;font-size:26px;color:var(--gl);margin-bottom:14px}
.hero-emojis{font-size:32px;letter-spacing:6px;margin-bottom:14px}
.hero-title{font-size:clamp(24px,5vw,38px);font-weight:900;color:#fff;margin-bottom:10px;line-height:1.15}
.hero-title .accent{color:var(--gl)}
.hero-sub{color:rgba(255,255,255,0.6);font-size:15px;max-width:480px;margin:0 auto 24px;line-height:1.6}
.hero-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(240,192,64,0.15);border:1px solid rgba(240,192,64,0.25);border-radius:100px;padding:5px 14px;color:var(--gl);font-size:12px;font-weight:800;margin-bottom:16px}
.user-greeting{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.1);border-radius:100px;padding:6px 16px;color:#fff;font-size:13px;font-weight:700;margin-bottom:20px}

/* SECTION */
.section{padding:28px 20px;max-width:960px;margin:0 auto}
.sec-title{font-size:20px;font-weight:900;color:var(--g);margin-bottom:16px;display:flex;align-items:center;gap:8px}

/* CARDS */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{border-radius:var(--r);padding:22px 14px;text-align:center;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;border:2px solid transparent;position:relative;overflow:hidden}
.card:hover{transform:translateY(-4px);box-shadow:var(--shl)}
.card-icon{font-size:40px;margin-bottom:10px;display:block}
.card-title{font-size:16px;font-weight:800;margin-bottom:4px}
.card-desc{font-size:12px;opacity:0.72;line-height:1.4}
.card-badge{position:absolute;top:8px;right:8px;background:var(--gl);color:var(--night);border-radius:8px;font-size:9px;font-weight:900;padding:2px 7px}
.card-lock{position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.15);color:#fff;border-radius:8px;font-size:9px;font-weight:800;padding:2px 7px}
.c-arabic{background:linear-gradient(135deg,#E8F5EE,#C8E6D0);color:var(--g);border-color:#A5D6B5}
.c-urdu{background:linear-gradient(135deg,#EDE7F6,#D4C4EC);color:var(--pur);border-color:#B39DCC}
.c-english{background:linear-gradient(135deg,#BBDEFB,#90CAF9);color:var(--sky);border-color:#64B5F6}
.c-duas{background:linear-gradient(135deg,#FFF8E1,#FFE082);color:#7A5000;border-color:#FFD040}
.c-quiz{background:linear-gradient(135deg,#FFEBEE,#FFCDD2);color:var(--rose);border-color:#EF9A9A}
.c-pillars{background:linear-gradient(135deg,#E8EAF6,#C5CAE9);color:#283593;border-color:#9FA8DA}
.c-prophets{background:linear-gradient(135deg,#FFF3E0,#FFE0B2);color:#E65100;border-color:#FFCC80}
.c-names{background:linear-gradient(135deg,#E0F2F1,#B2DFDB);color:#00695C;border-color:#80CBC4}
.c-quran{background:linear-gradient(135deg,#F1F8E9,#DCEDC8);color:#33691E;border-color:#AED581}
.c-tajweed{background:linear-gradient(135deg,#FCE4EC,#F8BBD0);color:#AD1457;border-color:#F48FB1}
.c-riyad{background:linear-gradient(135deg,#E8F5EE,#B2DFDB);color:#1B5E20;border-color:#81C784}
.c-seerat{background:linear-gradient(135deg,#FFF8E1,#FFE0B2);color:#5c2200;border-color:#C9860A}
.c-riyadh{background:linear-gradient(135deg,#E8F5E9,#C8E6C9);color:#1B5E20;border-color:#81C784}

/* RIYADH MODULE */
.riyadh-hero{background:linear-gradient(160deg,#0a1f0a,#1B3A1B,#2d5a2d);padding:26px 20px;text-align:center;position:relative;overflow:hidden}
.riyadh-hero::before{content:'﷽';position:absolute;top:8px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.06);font-size:60px;white-space:nowrap}
.riyadh-hero-arabic{font-family:'Amiri',serif;font-size:28px;color:var(--gl);margin-bottom:4px}
.riyadh-hero-sub{color:rgba(255,255,255,0.6);font-size:12px;margin-bottom:16px;line-height:1.6}
.riyadh-cat-bar{display:flex;gap:6px;padding:12px 16px;overflow-x:auto;background:#fff;border-bottom:1px solid #e8f5e9;-webkit-overflow-scrolling:touch}
.riyadh-cat-chip{flex-shrink:0;background:#E8F5E9;border:1.5px solid transparent;border-radius:100px;padding:7px 14px;font-size:11px;font-weight:800;color:#1B5E20;cursor:pointer;white-space:nowrap;transition:all 0.2s}
.riyadh-cat-chip.active{background:#1B5E20;color:#fff}
.riyadh-card{background:#fff;border-radius:18px;margin:10px 16px;padding:20px;box-shadow:0 4px 20px rgba(27,94,32,0.10);border-left:5px solid #2E7D32}
.riyadh-hadees-num{font-size:10px;font-weight:800;color:#2E7D32;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.riyadh-arabic{font-family:'Amiri',serif;font-size:22px;color:#1a3a1a;direction:rtl;text-align:right;line-height:2;margin-bottom:12px;background:#F1F8E9;border-radius:12px;padding:14px}
.riyadh-ref{display:inline-flex;align-items:center;gap:5px;background:#E8F5E9;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:800;color:#2E7D32;margin-bottom:10px}
.riyadh-urdu{font-family:'Amiri',serif;font-size:17px;color:#1a3a1a;direction:rtl;text-align:right;line-height:2.2;margin-bottom:10px;border-right:3px solid #81C784;padding-right:12px}
.riyadh-faida{background:#F9FBE7;border-radius:12px;padding:12px 14px;font-size:12px;color:#33691E;line-height:1.7;margin-top:8px;border-left:3px solid #AED581}
.riyadh-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.riyadh-listen-btn{background:#1B5E20;color:#fff;border:none;border-radius:10px;padding:9px 16px;font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all 0.2s}
.riyadh-listen-btn:hover{background:#2E7D32}
.riyadh-listen-btn.urdu-btn{background:#4527A0}
.riyadh-listen-btn.stop-btn{background:#c62828}
.riyadh-search{width:100%;border:2px solid #C8E6C9;border-radius:12px;padding:11px 14px;font-family:'Nunito',sans-serif;font-size:14px;outline:none;margin:10px 16px 0;width:calc(100% - 32px);transition:border 0.2s}
.riyadh-search:focus{border-color:#2E7D32}
.c-fiqh{background:linear-gradient(135deg,#EDE7F6,#D1C4E9);color:#4527A0;border-color:#B39DDB}
.c-tasbeeh{background:linear-gradient(135deg,#E0F7FA,#B2EBF2);color:#00838F;border-color:#80DEEA}
.c-qibla{background:linear-gradient(135deg,#FFF3E0,#FFE0B2);color:#E65100;border-color:#FFCC80}
.c-calendar{background:linear-gradient(135deg,#F3E5F5,#E1BEE7);color:#6A1B9A;border-color:#CE93D8}
.c-prayer{background:linear-gradient(135deg,#E8F5E9,#C8E6C9);color:#2E7D32;border-color:#A5D6A7}
.c-recite{background:linear-gradient(135deg,#FFEBEE,#FFCDD2);color:#C62828;border-color:#EF9A9A}

/* TASBEEH COUNTER */
.tasbeeh-wrap{max-width:420px;margin:0 auto;padding:24px;text-align:center}
.tasbeeh-display{background:linear-gradient(160deg,var(--night),#0f2d1a);border-radius:28px;padding:40px 24px;margin-bottom:20px}
.tasbeeh-count{font-size:72px;font-weight:900;color:var(--gl);line-height:1}
.tasbeeh-target{color:rgba(255,255,255,0.5);font-size:14px;margin-top:8px}
.tasbeeh-dhikr-name{color:#fff;font-size:18px;font-weight:800;margin-bottom:4px}
.tasbeeh-dhikr-arabic{font-family:'Amiri',serif;font-size:28px;color:var(--gl);margin-bottom:16px}
.tasbeeh-btn{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#2C5C9E,var(--g));border:none;color:#fff;font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 10px 30px rgba(44,92,158,0.4);transition:transform 0.1s}
.tasbeeh-btn:active{transform:scale(0.95)}
.tasbeeh-reset{margin-top:20px;background:var(--gp);color:var(--g);border:none;border-radius:12px;padding:10px 22px;font-family:'Nunito';font-weight:800;cursor:pointer}
.tasbeeh-presets{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.tasbeeh-preset-chip{background:var(--gp);color:var(--g);border:1.5px solid transparent;border-radius:100px;padding:7px 14px;font-size:12px;font-weight:800;cursor:pointer}
.tasbeeh-preset-chip.active{background:var(--g);color:#fff}

/* QIBLA COMPASS */
.qibla-wrap{max-width:420px;margin:0 auto;padding:24px;text-align:center}
.qibla-compass-ring{width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,#fff,var(--gp));border:4px solid var(--g);margin:20px auto;position:relative;display:flex;align-items:center;justify-content:center}
.qibla-needle{position:absolute;width:6px;height:120px;background:linear-gradient(180deg,#C62828,transparent);top:20px;left:50%;transform-origin:bottom center;border-radius:6px}
.qibla-kaaba-icon{font-size:32px;position:relative;z-index:2}
.qibla-degree{font-size:42px;font-weight:900;color:var(--g);margin-top:12px}
.qibla-info-box{background:var(--gp);border-radius:14px;padding:16px;margin-top:16px;font-size:13px;color:var(--g);line-height:1.6}

/* ISLAMIC CALENDAR */
.cal-wrap{max-width:480px;margin:0 auto;padding:20px}
.cal-hijri-card{background:linear-gradient(135deg,var(--night),#0f2d1a);border-radius:20px;padding:28px;text-align:center;margin-bottom:20px}
.cal-month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav-btn{width:40px;height:40px;border-radius:50%;border:2px solid var(--gp);background:#fff;color:var(--g);font-size:22px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cal-month-title{font-weight:900;font-size:16px;color:var(--g)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:20px}
.cal-grid-head{text-align:center;font-size:11px;font-weight:800;color:var(--soft);padding:4px 0}
.cal-cell{position:relative;aspect-ratio:1;border-radius:10px;background:var(--gp);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px}
.cal-cell-g{font-weight:800;color:var(--text)}
.cal-cell-h{font-size:9px;color:var(--soft)}
.cal-cell-today{background:var(--g);box-shadow:0 0 0 2px var(--gl)}
.cal-cell-today .cal-cell-g,.cal-cell-today .cal-cell-h{color:#fff}
.cal-cell-event{background:linear-gradient(135deg,var(--gl),var(--gold))}
.cal-cell-event .cal-cell-g{color:#3a2800}
.cal-cell-dot{position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:#C62828}
.cal-hijri-date{font-size:30px;font-weight:900;color:var(--gl)}
.cal-hijri-sub{color:rgba(255,255,255,0.6);font-size:13px;margin-top:6px}
.cal-gregorian{color:rgba(255,255,255,0.4);font-size:12px;margin-top:10px}
.cal-events-list{background:#fff;border-radius:16px;padding:18px;box-shadow:var(--sh)}
.cal-event-item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f0f0f0}
.cal-event-item:last-child{border-bottom:none}
.cal-event-name{font-weight:700;color:var(--text);font-size:13px}
.cal-event-date{color:var(--soft);font-size:12px}

/* PRAYER TIMES */
.prayer-wrap{max-width:480px;margin:0 auto;padding:20px}
.prayer-location-box{background:var(--gp);border-radius:14px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--g);font-weight:700}
.prayer-times-list{background:#fff;border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.prayer-time-row{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #f5f5f5}
.prayer-time-row:last-child{border-bottom:none}
.prayer-time-row.next-prayer{background:var(--gp)}
.prayer-name{font-weight:800;color:var(--text);font-size:15px;display:flex;align-items:center;gap:10px}
.prayer-time-val{font-weight:900;color:var(--g);font-size:16px}
.prayer-countdown-card{background:linear-gradient(135deg,var(--g),#2C5C9E);border-radius:16px;padding:18px;text-align:center;margin-bottom:16px;color:#fff}

/* AI RECITATION CHECKER */
.recite-wrap{max-width:480px;margin:0 auto;padding:24px;text-align:center}
.recite-ayah-card{background:#fff;border-radius:18px;padding:24px;box-shadow:var(--sh);margin-bottom:20px}
.recite-ayah-arabic{font-family:'Amiri',serif;font-size:30px;color:var(--text);direction:rtl;line-height:1.9;margin-bottom:10px}
.recite-mic-btn{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#C62828,#E53935);border:none;color:#fff;font-size:34px;cursor:pointer;box-shadow:0 8px 24px rgba(198,40,40,0.4);transition:transform 0.15s}
.recite-mic-btn.listening{animation:pulse-mic 1.2s infinite}
@keyframes pulse-mic{0%{box-shadow:0 0 0 0 rgba(198,40,40,0.5)}70%{box-shadow:0 0 0 20px rgba(198,40,40,0)}100%{box-shadow:0 0 0 0 rgba(198,40,40,0)}}
.recite-result-box{margin-top:18px;border-radius:14px;padding:16px;font-size:14px;font-weight:700}
.recite-result-good{background:#E8F5E9;color:#2E7D32}
.recite-result-bad{background:#FFEBEE;color:#C62828}
.recite-transcript{font-size:13px;color:var(--soft);margin-top:10px;font-style:italic}

/* FIQH MODULE */
.fiqh-disclaimer{margin:14px 18px;background:#FFF3E0;border-left:4px solid #E65100;border-radius:12px;padding:14px 16px;font-size:12px;color:#7A4500;line-height:1.6}
.fiqh-cat-bar{display:flex;gap:8px;padding:14px 18px;overflow-x:auto;background:#fff;border-bottom:1px solid #eee;-webkit-overflow-scrolling:touch}
.fiqh-cat-chip{flex-shrink:0;background:#EDE7F6;border:1.5px solid transparent;border-radius:100px;padding:8px 16px;font-size:12px;font-weight:800;color:#4527A0;cursor:pointer;white-space:nowrap}
.fiqh-cat-chip.active{background:#4527A0;color:#fff}
.fiqh-lang-toggle{display:flex;gap:6px;padding:10px 18px;background:#fafafa}

<script type="text/babel">
const {useState,useRef,useEffect,useCallback}=React;

/* ═══════ HELPERS ═══════ */
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
/* ═══ ELEVENLABS TTS ═══
   Arabic voice: Aria (multilingual, clear Arabic)
   Urdu voice:   Aria (multilingual, best Urdu available on free tier)
   Replace VOICE IDs below if you want different voices from elevenlabs.io/voice-library
═══ */
const ELEVEN_KEY_PLACEHOLDER = 'YOUR_ELEVENLABS_API_KEY'; // replaced by worker secret
const ELEVEN_VOICES = {
  'ar-SA': 'pNInz6obpgDQGcFmaJgB', // Adam - clear multilingual Arabic
  'ur-PK': 'EXAVITQu4vr4xnSDxMaL', // Bella - warm multilingual Urdu
};

function getBestBrowserVoice(lang){
  if(!window.speechSynthesis) return null;
  const voices = window.speechSynthesis.getVoices();
  const google = voices.find(v=>v.lang.startsWith(lang.split('-')[0]) && v.name.toLowerCase().includes('google'));
  const exact  = voices.find(v=>v.lang === lang);
  const prefix = voices.find(v=>v.lang.startsWith(lang.split('-')[0]));
  return google || exact || prefix || null;
}

function browserSpeak(text, lang, onEnd){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const doSpeak = ()=>{
    const u = new SpeechSynthesisUtterance(text);
    const v = getBestBrowserVoice(lang);
    if(v) u.voice = v;
    u.lang = lang; u.rate = 0.85;
    if(onEnd) u.onend = onEnd;
    window.speechSynthesis.speak(u);
  };
  if(window.speechSynthesis.getVoices().length === 0){
    window.speechSynthesis.onvoiceschanged = doSpeak;
  } else { doSpeak(); }
}

let currentAudio = null;

async function elevenSpeak(text, lang='en-US', onEnd=null){
  if(currentAudio){ currentAudio.pause(); currentAudio=null; }
  if(window.speechSynthesis) window.speechSynthesis.cancel();

  const voiceId = ELEVEN_VOICES[lang];

  // Arabic & Urdu → ElevenLabs via our Cloudflare Worker (key stays hidden)
  if(voiceId){
    try{
      const res = await fetch(AI_WORKER_URL, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ mode:'tts', text: text.slice(0,500), voice: voiceId, lang })
      });
      const ct = res.headers.get('content-type')||'';
      if(!ct.includes('application/json') && res.ok){
        const blob = await res.blob();
        if(blob.size > 100){
          const url = URL.createObjectURL(blob);
          currentAudio = new Audio(url);
          currentAudio.onended = ()=>{ URL.revokeObjectURL(url); currentAudio=null; if(onEnd) onEnd(); };
          currentAudio.onerror = ()=>{ URL.revokeObjectURL(url); currentAudio=null; browserSpeak(text,lang,onEnd); };
          await currentAudio.play();
          return;
        }
      }
    }catch(e){ console.warn('ElevenLabs error:',e); }
    // fallback to browser
    browserSpeak(text, lang, onEnd);
    return;
  }

  // English & others → StreamElements (free, human-like)
  try{
    const seVoice = lang==='ur-PK'?'Aditi':'Brian';
    const url = `https://api.streamelements.com/kappa/v2/speech?voice=${seVoice}&text=${encodeURIComponent(text.slice(0,500))}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('SE '+res.status);
    const blob = await res.blob();
    if(!blob.size) throw new Error('empty');
    const audioUrl = URL.createObjectURL(blob);
    currentAudio = new Audio(audioUrl);
    currentAudio.onended = ()=>{ URL.revokeObjectURL(audioUrl); currentAudio=null; if(onEnd) onEnd(); };
    currentAudio.onerror = ()=>{ URL.revokeObjectURL(audioUrl); currentAudio=null; browserSpeak(text,lang,onEnd); };
    await currentAudio.play();
  }catch(err){
    console.warn('StreamElements fallback:', err);
    browserSpeak(text, lang, onEnd);
  }
}

function stopElevenAudio(){
  if(currentAudio){ currentAudio.pause(); currentAudio=null; }
  if(window.speechSynthesis) window.speechSynthesis.cancel();
}

function speak(text,lang='ar-SA'){
  elevenSpeak(text,lang);
}
function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}

    urdu:`حضور نبی اکرم صلی اللہ علیہ وسلم عام الفیل کے سال مکہ مکرمہ میں پیدا ہوئے۔ یہ وہ سال تھا جب ابرہہ اپنے ہاتھیوں کی فوج لے کر خانہ کعبہ کو گرانے آیا تھا، مگر اللہ تعالیٰ نے ابابیل پرندوں کے ذریعے اس لشکر کو تباہ کر دیا۔ آپ صلی اللہ علیہ وسلم کے والد حضرت عبداللہ آپ کی ولادت سے پہلے ہی انتقال فرما چکے تھے، اس لیے آپ یتیم پیدا ہوئے۔ آپ کی والدہ محترمہ حضرت آمنہ رضی اللہ عنہا نے فرمایا کہ ولادت کے وقت ایک روشنی ظاہر ہوئی جس نے شام کے محلات تک منور کر دیے۔

آپ صلی اللہ علیہ وسلم کو ابتدا میں حضرت ثویبہ نے دودھ پلایا، پھر بنو سعد قبیلے کی حضرت حلیمہ سعدیہ رضی اللہ عنہا کے ہاں آپ کی پرورش ہوئی۔ حضرت حلیمہ فرماتی ہیں کہ جب سے یہ بچہ ان کے گھر آیا، ان کے گھر میں برکت ہی برکت ہو گئی — بکریاں خوب دودھ دینے لگیں، قحط میں بھی ان کا گھرانہ سیر رہا۔ چار سال بنو سعد میں گزارنے کے بعد، واقعہ شق الصدر کے وقت حضرت جبریل علیہ السلام نے آپ کا سینہ مبارک چاک کرکے دل کو پاک کیا اور گناہ کی کالی رگ نکالی۔ حضرت حلیمہ نے اس کے بعد آپ کو مکہ واپس کر دیا۔

مکہ واپسی کے بعد چھ سال کی عمر میں آپ کی والدہ حضرت آمنہ کا بھی انتقال ہو گیا۔ پھر آپ کے دادا حضرت عبدالمطلب نے آپ کی پرورش کی، مگر آٹھ برس کی عمر میں وہ بھی رحلت فرما گئے۔ اس کے بعد آپ کے چچا حضرت ابو طالب نے آپ کو اپنی پناہ میں لے لیا اور عمر بھر آپ کا ساتھ دیا۔`,
    roman:`Hazoor Nabi Akram ﷺ Aam-ul-Feel ke saal Makkah Mukarramah mein paida hue. Ye woh saal tha jab Abraha apni haathiyon ki fauj le kar Khana-e-Kaaba girane aaya tha, magar Allah Ta'ala ne Ababeel parindoon ke zariye us lashkar ko tabah kar diya. Aap ﷺ ke walid Hazrat Abdullah aap ki wiladat se pehle hi inteqal farma chuke the, is liye aap yateem paida hue. Aap ki walida Hazrat Aaminah ne farmaya ke wiladat ke waqt ek roshni zahir hui jo Sham ke mahalaat tak munawwar kar gayi.

Aap ﷺ ko ibtida mein Hazrat Suwaibah ne doodh pilaya, phir Banu Sa'd qabeel ki Hazrat Haleemah Sa'diyah ke haan aap ki parwarish hui. Hazrat Haleemah farmaati hain ke jab se ye bachcha unke ghar aaya, ghar mein barkat hi barkat ho gayi — bakryan khoob doodh dene lagin. Char saal Banu Sa'd mein guzaarne ke baad, waqia-e-Shaqq-ul-Sadr ke waqt Hazrat Jibreel a.s. ne aap ka seena mubaarak chaak kar ke dil ko paak kiya. Hazrat Haleemah ne aap ko Makkah waapis kar diya.

Chhe saal ki umra mein walida Hazrat Aaminah ka inteqal hua. Phir daada Hazrat Abdul Muttalib ne parwarish ki, magar aath saal ki umra mein wo bhi rahmat farma gaye. Is ke baad chacha Hazrat Abu Talib ne aap ko panah di aur umra bhar saath diya.`,
    highlight:{ar:'وَوَجَدَكَ يَتِيمًا فَآوَىٰ', trans:'Aur usne tumhe yateem paya to panah di. — Surah Ad-Duha 93:6'}

    urdu:`آپ صلی اللہ علیہ وسلم بچپن سے ہی بہت سمجھدار، صادق اور امانت دار تھے۔ اہل مکہ آپ کو "الصادق الامین" یعنی سچے اور امانت دار کے لقب سے جانتے تھے۔ آپ نے کبھی جھوٹ نہیں بولا، نہ کوئی برا کام کیا۔ جوانی میں آپ نے اپنے چچا کے ساتھ تجارت سیکھی اور ملک شام کے سفر کیے۔ ایک سفر میں راہب بُحیرا نے آپ کو دیکھ کر پہچانا کہ یہ وہی نبی ہیں جن کی بشارت توریت اور انجیل میں دی گئی ہے۔

پچیس سال کی عمر میں آپ نے حضرت خدیجہ رضی اللہ عنہا کے مال کے ساتھ تجارت کی۔ حضرت خدیجہ نے آپ کی دیانتداری، اخلاق اور محنت دیکھ کر شادی کی پیشکش کی اور آپ نے قبول فرمایا۔ حضرت خدیجہ آپ کی پہلی زوجہ تھیں اور وہ پہلی شخص بھی جنہوں نے اسلام قبول کیا۔

    roman:`Aap ﷺ bachpan se hi bahut samajhdar, saadiq aur amanat-daar the. Ahl-e-Makkah aap ko "Al-Saadiq Al-Ameen" yaani sachche aur amanat-daar ke laqab se jaante the. Aap ne kabhi jhooth nahi bola, na koi bura kaam kiya. Jawani mein aap ne apne chacha ke saath tijarat seekhi aur Sham ke safar kiye. Ek safar mein Raahib Buhayra ne aap ko dekh kar pehchana ke ye wohi Nabi hain jin ki khushkhabri Tawraat aur Injeel mein di gayi hai.

Pacchees saal ki umra mein aap ne Hazrat Khadijah r.a. ke maal ke saath tijarat ki. Hazrat Khadijah ne aap ki diyanat-daari, akhlaq aur mehnat dekh kar shaadi ki paishkash ki aur aap ne qabool farmaya. Hazrat Khadijah aap ki pehli zaujah thin aur woh pehli shakhs bhi jo Islam le aayin.

    urdu:`جب آپ صلی اللہ علیہ وسلم کی عمر چالیس سال ہوئی، تو آپ غار حرا میں خلوت اختیار فرماتے تھے اور وہاں عبادت اور غور و فکر میں مشغول رہتے تھے۔ رمضان المبارک کی ستائیسویں رات کو حضرت جبریل علیہ السلام پہلی بار آئے اور فرمایا: "اقرا" یعنی "پڑھو"۔ آپ نے فرمایا: "میں پڑھا لکھا نہیں ہوں۔" حضرت جبریل نے آپ کو بھینچا اور پھر فرمایا: "اقرا باسم ربک الذی خلق" — یہ سورہ علق کی ابتدائی آیات تھیں، جو قرآن کریم کی سب سے پہلے نازل ہونے والی آیات ہیں۔

پہلی وحی کے بعد کچھ عرصے کے لیے وحی کا سلسلہ رک گیا — اسے "فترت الوحی" کہا جاتا ہے۔ اس دوران آپ بے چین رہے۔ پھر دوسری وحی آئی: "یا أیها المدثر" — اس کے ساتھ ہی آپ کا علانیہ تبلیغ کا دور شروع ہوا۔`,
    roman:`Jab aap ﷺ ki umra chaalees saal hui, to aap Ghaar-e-Hira mein khalwat ikhtiyar farmaate the aur wahin ibadat aur ghaur-o-fikr mein mashghool rehte the. Ramadan Mubaarak ki sataaiswin raat ko Hazrat Jibreel a.s. pehli baar aaye aur farmaya: "Iqra" yaani "Parho". Aap ne farmaya: "Main parha likha nahi hoon." Hazrat Jibreel ne aap ko bheencha aur phir farmaya: "Iqra bismi Rabbikal-ladhi khalaq" — ye Surah Al-Alaq ki ibtidaai aayaat thin, jo Quran Kareem ki sabse pehle naazil hone waali aayaat hain.

    urdu:`شروع میں آپ صلی اللہ علیہ وسلم نے پوشیدہ طریقے سے دعوت دی۔ سب سے پہلے حضرت خدیجہ نے اسلام قبول کیا، پھر حضرت علی، حضرت زید بن حارثہ اور حضرت ابوبکر صدیق نے۔ تین سال بعد اللہ کا حکم آیا کہ علانیہ تبلیغ کریں۔ آپ نے کوہِ صفا پر کھڑے ہو کر قریش کو اکٹھا کیا اور فرمایا: "کیا آپ لوگ مجھ پر بھروسہ کرتے ہیں؟" سب نے کہا: "ہاں، آپ تو الامین ہیں۔" آپ نے فرمایا: "تو میں تمہیں ایک عذاب سے ڈراتا ہوں۔" اس پر ابو لہب نے گالی دی — اور سورہ مسد نازل ہوئی۔

قریش نے مسلمانوں پر ظلم و ستم کا بازار گرم کر دیا۔ حضرت بلال حبشی رضی اللہ عنہ کو دھوپ میں تپتی ریت پر لٹایا جاتا تھا اور سینے پر بھاری پتھر رکھا جاتا تھا، مگر ان کی زبان پر بس "احد احد" رہتا تھا۔ حضرت یاسر، حضرت سمیہ اور ان کے بیٹے حضرت عمار کو بھی ایسی ہی اذیتیں دی گئیں۔ حضرت سمیہ رضی اللہ عنہا اسلام کی پہلی شہیدہ ہیں۔

آپ صلی اللہ علیہ وسلم نے کچھ مسلمانوں کو حبشہ (ایتھوپیا) ہجرت کرنے کا حکم دیا جہاں کا عادل بادشاہ نجاشی (اصحمہ) تھا۔ نجاشی نے مسلمانوں کو پناہ دی اور قریش کے نمائندوں کو خالی ہاتھ واپس کر دیا۔ یہ اسلام کی پہلی ہجرت تھی۔ اسی زمانے میں حضرت حمزہ اور حضرت عمر رضی اللہ عنہما نے اسلام قبول کر کے مسلمانوں میں نئی جان ڈال دی۔`,
    roman:`Shuru mein aap ﷺ ne posheedah tareeqe se da'wat di. Sabse pehle Hazrat Khadijah ne Islam qabool kiya, phir Hazrat Ali, Hazrat Zaid bin Haritha aur Hazrat Abu Bakr Siddiq ne. Teen saal baad Allah ka hukum aaya ke ilaniya tableegh karen. Aap ne Koh-e-Safa par khare ho kar Quraish ko ikhatta kiya aur farmaya: "Kya aap log mujh par bharosa karte hain?" Sab ne kaha: "Haan, aap to Al-Ameen hain." Aap ne farmaya: "To main tumhe ek azaab se darata hoon." Is par Abu Lahab ne gaali di — aur Surah Masad naazil hui.

    urdu:`ہجرت سے ایک سال پہلے آپ صلی اللہ علیہ وسلم کو واقعہ اسراء و معراج کی عظیم سعادت ملی۔ یہ واقعہ ربیع الاول کی ایک رات کو ہوا — رجب کی ستائیسویں شب کا بھی ذکر ملتا ہے۔ آپ مسجد الحرام سے بُراق پر سوار ہو کر بیت المقدس (مسجد الاقصیٰ) تشریف لے گئے۔ وہاں سب انبیاء علیہم السلام کو آپ کی امامت میں نماز ادا کرتے دکھایا گیا۔ پھر آپ آسمانوں کی سیر پر گئے جہاں مختلف آسمانوں پر مختلف انبیاء سے ملاقات ہوئی — پہلے آسمان پر حضرت آدم، دوسرے پر حضرت عیسیٰ و یحییٰ، تیسرے پر حضرت یوسف، چوتھے پر حضرت ادریس، پانچویں پر حضرت ہارون، چھٹے پر حضرت موسیٰ اور ساتویں پر حضرت ابراہیم علیہم السلام۔

    roman:`Hijrat se ek saal pehle aap ﷺ ko waqia Isra wal Mi'raaj ki azeem sa'aadat mili. Aap Masjid-ul-Haram se Buraaq par sawar ho kar Bait-ul-Maqdis (Masjid Al-Aqsa) tashreef le gaye. Wahan sab Ambiya a.s. ko aap ki imaamat mein namaz ada karte dikhaya gaya. Phir aap aasmaanon ki sair par gaye jahan mukhtalif aasmaanon par Ambiya se mulaqaat hui — pehle aasmaan par Hazrat Adam, doosre par Hazrat Isa aur Yahya, teesre par Hazrat Yusuf, chauthe par Hazrat Idrees, paanchwen par Hazrat Haroon, chhathe par Hazrat Moosa aur saatwen par Hazrat Ibrahim a.s.

    urdu:`نبوت کے تیرہویں سال، قریش نے طے کر لیا کہ آپ صلی اللہ علیہ وسلم کو قتل کر دیا جائے۔ یہ منصوبہ "دار الندوہ" میں بنا کہ ہر قبیلے کا ایک نوجوان بیک وقت آپ پر حملہ کرے تاکہ خون کسی ایک قبیلے پر نہ پڑے۔ اللہ تعالیٰ نے آپ کو وحی کے ذریعے آگاہ کر دیا۔ آپ نے حضرت علی کو اپنی چادر اڑھا کر اپنے بستر پر سلایا — تاکہ لوگ سمجھتے رہیں آپ گھر میں ہیں — اور خود حضرت ابوبکر کے ساتھ روانہ ہو گئے۔

    roman:`Nubuwwat ke terrahwen saal, Quraish ne tay kar liya ke aap ﷺ ko qatl kar diya jaye. Aap ne Hazrat Ali ko apni chaadar urha kar apne bistar par sulaya — taake log samajhte rahen aap ghar mein hain — aur khud Hazrat Abu Bakr ke saath rawana ho gaye.

Aap teen din Ghaar-e-Saur mein chhupe rahe. Quraish ke jaasoos ghaar ke darwaaze tak aa gaye — Hazrat Abu Bakr dare, to aap ﷺ ne farmaya: "La tahzan, innallaha ma'ana" — "Gham na karo, beshak Allah hamare saath hai." Ghaar ke darwaaze par makdi ne jaala bun diya aur kabutar ne anday de diye, jaasoos ye dekh kar waapis chale gaye.

Phir aap ﷺ Madinah ki taraf rawana hue aur "Quba" mein pahunch kar pehli masjid — Masjid Quba — ki bunyaad rakhi. Madinah mein aap ka istaqbaal Ansaar ne bade josh-o-khurosh se kiya — bachche aur aurtein geet gaate hue nikle: "Tala'al Badru 'Alayna" — "Hum par chaand tulu hua hai." Madinah mein aap ne Masjid Nabawi taameer ki, Ansaar aur Muhaajireen ke darmiyaan Mu'aakhaah (bhai chara) qaayim ki aur Madinah ka dastur (Meeqaaq-e-Madinah) likha.`,

    urdu:`ہجرت کے آٹھویں سال رمضان المبارک میں آپ صلی اللہ علیہ وسلم دس ہزار صحابہ کے ساتھ مکہ کی طرف روانہ ہوئے۔ قریش نے مزاحمت نہیں کی اور مکہ بغیر لڑائی کے فتح ہو گیا — یہ اسلامی تاریخ کی سب سے عظیم فتح ہے۔ آپ مکہ میں داخل ہوئے تو سر جھکائے ہوئے تھے — عاجزی کا وہ منظر کہ سر اپنی سواری سے لگ رہا تھا۔

    urdu:`ہجرت کے دسویں سال آپ صلی اللہ علیہ وسلم نے حج ادا کیا جو آپ کا پہلا اور آخری حج تھا — اسے "حجۃ الوداع" کہا جاتا ہے۔ ایک لاکھ سے زیادہ صحابہ نے اس حج میں آپ کے ساتھ شرکت کی۔ نویں ذوالحجہ کو میدان عرفات میں آپ نے تاریخ کا سب سے عظیم خطبہ دیا۔

    roman:`Hijrat ke daswen saal aap ﷺ ne Hajj ada kiya jo aap ka pehla aur aakhiri Hajj tha — ise "Hajjatul Widaa" kehte hain. Ek laakh se zyaada Sahaaba ne is Hajj mein aap ke saath shirkat ki. Naween Dhul-Hijjah ko maidaan-e-Arafat mein aap ne taareekh ka sabse azeem khutbah diya.

    urdu:`حجۃ الوداع سے واپسی کے بعد آپ صلی اللہ علیہ وسلم بیمار پڑ گئے۔ بیماری کے دنوں میں بھی آپ جب ممکن ہوتا نماز پڑھاتے رہے، اور جب زیادہ تکلیف ہوئی تو حضرت ابوبکر کو نماز پڑھانے کا حکم دیا۔ آخری ایام میں آپ نے فرمایا: "یہود و نصاریٰ نے اپنے انبیاء کی قبروں کو سجدہ گاہ بنا لیا — تم اپنی مساجد میں قبریں مت بناؤ۔"

    roman:`Hajjatul Widaa se waapsi ke baad aap ﷺ beemaar par gaye. Beemaari ke dinon mein bhi aap jab mumkin hota namaz parhaate rahe, aur jab zyaada takleef hui to Hazrat Abu Bakr ko namaz parhaane ka hukum diya. Aakhiri ayyam mein aap ne farmaya: "Yahood wa Nasaara ne apne Ambiya ki qabron ko sajdagaah bana liya — tum apni masaajid mein qabren mat banaao."

Aap ﷺ ka warsa kya hai? Quran Kareem, Sunnat Mubarakah, Tawheed ki da'wat, insaani musaawaat ka paighaam, adl-o-rehmat ka nizaam — aur laakhon woh dil jo aaj bhi "Sallallahu Alaihi Wasallam" kehte hue aansu bahaate hain.`,

function SeeratMod({onBack}){
  const [lang, setLang] = useState('roman'); // 'urdu' | 'roman'
  const [activeIdx, setActiveIdx] = useState(0);
  const [isPlaying, setIsPlaying] = useState(false);
  const [progress, setProgress] = useState(0);
  const synth = useRef(null);
  const utterRef = useRef(null);
  const chap = SEERAT_CHAPTERS[activeIdx];

  useEffect(()=>{ return ()=>{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }; }, []);

  function getTextToSpeak(){
    const title = lang==='urdu' ? chap.title_ur : chap.title_en;
    const body = lang==='urdu' ? chap.urdu : chap.roman;
    return title + '۔ ' + body;
  }

  function getSpeakLang(){ return lang==='urdu' ? 'ur-PK' : 'en-US'; }

  function startNarration(){
    const text = getTextToSpeak();
    setIsPlaying(true); setProgress(10);
    elevenSpeak(text, getSpeakLang(), ()=>{ setIsPlaying(false); setProgress(100); toast('✅ Seerat section mukammal hua!'); });
    let p=10; const iv=setInterval(()=>{ p+=1; setProgress(Math.min(p,95)); if(p>=95) clearInterval(iv); },800);
  }
  function pauseNarration(){ stopElevenAudio(); setIsPlaying(false); }
  function resumeNarration(){ startNarration(); }
  function stopNarration(){ stopElevenAudio(); setIsPlaying(false); setProgress(0); }

  function goChapter(idx){
    stopNarration();
    setActiveIdx(idx);
    setProgress(0);
    window.scrollTo({top:0, behavior:'smooth'});
  }

  const totalTime = SEERAT_CHAPTERS.reduce((a,c)=>a+c.time_min, 0);

  return(
    <>
      <div className="lhdr">
        <button className="back-btn" onClick={()=>{stopNarration();onBack();}}>← Back</button>
        <div className="l-title">☪️ Seerat-un-Nabi ﷺ</div>
        <div style={{marginLeft:'auto',fontSize:'11px',color:'var(--soft)',fontWeight:700}}>⏱️ ~{totalTime} min</div>
      </div>

      {/* HERO */}

        </div>
      </div>

      {/* CHAPTER SELECTOR */}
      <div className="seerat-chapters">
        {SEERAT_CHAPTERS.map((c,i)=>(
          <button key={c.key} className={`seerat-ch-btn ${activeIdx===i?'active':''}`} onClick={()=>goChapter(i)}>
            {c.emoji} {c.num}. {lang==='urdu' ? c.title_ur.split(' ').slice(0,3).join(' ') : c.title_en}
          </button>
        ))}
      </div>

      {/* CHAPTER CONTENT */}
      <div className="seerat-chapter-card">
        <div className="seerat-chapter-num">CHAPTER {chap.num} OF {SEERAT_CHAPTERS.length} • {chap.emoji}</div>

        {lang==='urdu'
          ? <div className="seerat-chapter-title-ur">{chap.title_ur}</div>
          : <div className="seerat-chapter-title">{chap.title_en}</div>
        }

        <div className="seerat-chapter-time">⏱️ ~{chap.time_min} min audio</div>

        {/* HIGHLIGHT AYAT */}
        <div className="seerat-highlight">
          <div className="seerat-highlight-arabic">{chap.highlight.ar}</div>
          <div className="seerat-highlight-trans">📖 {chap.highlight.trans}</div>
        </div>

        {/* MAIN CONTENT */}
        {lang==='urdu'
          ? <div className="seerat-body-ur">{chap.urdu}</div>
          : <div className="seerat-body-roman">{chap.roman}</div>
        }

        {/* PREV / NEXT */}
        <div style={{display:'flex',gap:'10px',marginTop:'24px'}}>
          <button
            onClick={()=>goChapter(activeIdx-1)}
            disabled={activeIdx===0}
            style={{flex:1,background:'#FFF3E0',color:'#7A3500',border:'none',borderRadius:'12px',padding:'12px',fontFamily:'Nunito',fontWeight:800,fontSize:'13px',cursor:'pointer',opacity:activeIdx===0?0.4:1}}>
            ← Pehla Chapter
          </button>
          <button
            onClick={()=>goChapter(activeIdx+1)}
            disabled={activeIdx===SEERAT_CHAPTERS.length-1}
            style={{flex:1,background:'#7A3500',color:'#fff',border:'none',borderRadius:'12px',padding:'12px',fontFamily:'Nunito',fontWeight:800,fontSize:'13px',cursor:'pointer',opacity:activeIdx===SEERAT_CHAPTERS.length-1?0.4:1}}>
            Agla Chapter →
          </button>
        </div>
      </div>

      {/* DARUD / FOOTER */}
      <div style={{textAlign:'center',padding:'16px 20px 100px',fontSize:'12px',color:'var(--soft)'}}>
        <div style={{fontFamily:'Amiri',fontSize:'20px',color:'#7A3500',marginBottom:'6px'}}>اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ</div>
        <div>Allahumma salli 'ala Muhammad wa 'ala aali Muhammad ﷺ</div>
        <div style={{marginTop:'8px',fontSize:'11px'}}>Chapter {activeIdx+1} of {SEERAT_CHAPTERS.length} • {lang==='urdu'?'اردو':'Roman English'} mode</div>
      </div>

      {/* AUDIO PLAYER BAR */}
      <div className="seerat-audio-bar">
        <button className="seerat-play-btn" onClick={isPlaying ? pauseNarration : resumeNarration}>
          {isPlaying ? '⏸' : '▶'}
        </button>
        <div className="seerat-player-info">
          <div className="seerat-player-title">{chap.emoji} {lang==='urdu' ? chap.title_ur : chap.title_en}</div>
          <div className="seerat-player-sub">{lang==='urdu'?'اردو آڈیو':'Roman English Audio'} • ~{chap.time_min} min</div>
          <div className="seerat-progress-bar" onClick={(e)=>{ const r=e.currentTarget.getBoundingClientRect(); const pct=(e.clientX-r.left)/r.width; setProgress(Math.round(pct*100)); }}>
            <div className="seerat-progress-fill" style={{width:progress+'%'}}/>
          </div>
        </div>
        <div className="seerat-nav-btns">
          <button className="seerat-nav-btn" disabled={activeIdx===0} onClick={()=>goChapter(activeIdx-1)}>⏮</button>
          <button className="seerat-nav-btn" onClick={stopNarration}>⏹</button>
          <button className="seerat-nav-btn" disabled={activeIdx===SEERAT_CHAPTERS.length-1} onClick={()=>goChapter(activeIdx+1)}>⏭</button>
        </div>
      </div>
    </>
  );
}

function RiyadMod({onBack}){
  const [chapIdx, setChapIdx] = useState(0);
  const [hadithIdx, setHadithIdx] = useState(0);
  const [view, setView] = useState('list'); // 'list' | 'read'
  const [isPlaying, setIsPlaying] = useState(false);
  const [playMode, setPlayMode] = useState('urdu'); // 'arabic' | 'urdu' | 'both'
  const chap = RIYAD_CHAPTERS[chapIdx];
  const hadith = chap.ahadith[hadithIdx];

  useEffect(()=>{ return ()=>{ window.speechSynthesis && window.speechSynthesis.cancel(); }; },[]);

  function stopAudio(){ stopElevenAudio(); setIsPlaying(false); }

  function playHadith(h, mode){
    stopElevenAudio();
    let text=''; let speakLang='ur-PK';
    if(mode==='arabic'){ text=h.arabic; speakLang='ar-SA'; }
    else if(mode==='urdu'){ text=h.urdu; speakLang='ur-PK'; }
    else { text=h.urdu; speakLang='ur-PK'; }
    setIsPlaying(true);
    elevenSpeak(text, speakLang, ()=>setIsPlaying(false));
  }

  function openHadith(ci, hi){
    stopAudio();
    setChapIdx(ci); setHadithIdx(hi);
    setView('read');
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function nextHadith(){
    stopAudio();
    if(hadithIdx < chap.ahadith.length-1){ setHadithIdx(h=>h+1); }
    else if(chapIdx < RIYAD_CHAPTERS.length-1){ setChapIdx(c=>c+1); setHadithIdx(0); }
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function prevHadith(){
    stopAudio();
    if(hadithIdx > 0){ setHadithIdx(h=>h-1); }
    else if(chapIdx > 0){ setChapIdx(c=>c-1); setHadithIdx(RIYAD_CHAPTERS[chapIdx-1].ahadith.length-1); }
    window.scrollTo({top:0,behavior:'smooth'});
  }

  const totalAhadith = RIYAD_CHAPTERS.reduce((a,c)=>a+c.ahadith.length,0);
  let globalIdx = 0;
  for(let i=0;i<chapIdx;i++) globalIdx+=RIYAD_CHAPTERS[i].ahadith.length;
  globalIdx += hadithIdx + 1;

  if(view==='read') return(
    <>
      <div className="lhdr">
        <button className="back-btn" onClick={()=>{stopAudio();setView('list');}}>← Back</button>
        <div className="l-title">📖 {chap.emoji} {chap.title.split('—')[0]}</div>
        <div style={{marginLeft:'auto',fontSize:'11px',color:'var(--soft)',fontWeight:700}}>{globalIdx}/{totalAhadith}</div>
      </div>

      {/* HADITH CARD */}
      <div style={{margin:'14px 18px',borderRadius:'20px',background:'#fff',padding:'24px',boxShadow:'0 4px 28px rgba(44,92,158,0.13)',borderTop:'5px solid var(--g)'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px',flexWrap:'wrap',gap:'8px'}}>
          <div style={{background:'var(--gp)',borderRadius:'10px',padding:'4px 12px',fontSize:'12px',fontWeight:800,color:'var(--g)'}}>{hadith.num}</div>
          <div style={{fontSize:'11px',color:'var(--soft)',fontWeight:700}}>📚 {hadith.ref}</div>
        </div>

        {/* ARABIC */}
        <div style={{fontFamily:'Amiri',fontSize:'26px',color:'#1a3a00',direction:'rtl',textAlign:'right',lineHeight:2,marginBottom:'18px',background:'#f8fdf5',borderRadius:'14px',padding:'16px'}}>
          {hadith.arabic}
        </div>

        {/* URDU */}
        <div style={{fontFamily:'Amiri',fontSize:'19px',color:'var(--text)',direction:'rtl',textAlign:'right',lineHeight:2.2,marginBottom:'16px',borderRight:'4px solid var(--gl)',paddingRight:'14px'}}>
          {hadith.urdu}
        </div>

        {/* FAIDA */}
        <div style={{background:'linear-gradient(135deg,#FFF8E1,#FFF3E0)',borderRadius:'14px',padding:'14px',marginBottom:'16px',borderLeft:'4px solid var(--gl)'}}>
          <div style={{fontSize:'12px',fontWeight:900,color:'#7A5000',marginBottom:'6px'}}>💡 Faida / Sabaq</div>
          <div style={{fontSize:'13px',color:'var(--text)',lineHeight:1.8}}>{hadith.faida}</div>
        </div>

        {/* AUDIO CONTROLS */}
        <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
          <button onClick={()=>{setPlayMode('arabic'); isPlaying ? stopAudio() : playHadith(hadith,'arabic');}}
            style={{flex:1,background:isPlaying&&playMode==='arabic'?'#BF360C':'#FBE9E7',color:isPlaying&&playMode==='arabic'?'#fff':'#BF360C',border:'none',borderRadius:'12px',padding:'12px 8px',fontFamily:'Nunito',fontWeight:900,fontSize:'12px',cursor:'pointer',minWidth:'80px'}}>
            {isPlaying&&playMode==='arabic'?'⏹ Rok':'🔊 Arabic'}
          </button>
          <button onClick={()=>{setPlayMode('urdu'); isPlaying&&playMode==='urdu' ? stopAudio() : playHadith(hadith,'urdu');}}
            style={{flex:1,background:isPlaying&&playMode==='urdu'?'var(--g)':'var(--gp)',color:isPlaying&&playMode==='urdu'?'#fff':'var(--g)',border:'none',borderRadius:'12px',padding:'12px 8px',fontFamily:'Nunito',fontWeight:900,fontSize:'12px',cursor:'pointer',minWidth:'80px'}}>
            {isPlaying&&playMode==='urdu'?'⏹ Rok':'🔊 Urdu'}
          </button>
          <button onClick={()=>{setPlayMode('both'); isPlaying&&playMode==='both' ? stopAudio() : playHadith(hadith,'both');}}
            style={{flex:1,background:isPlaying&&playMode==='both'?'#5B3A8A':'#EDE7F6',color:isPlaying&&playMode==='both'?'#fff':'#5B3A8A',border:'none',borderRadius:'12px',padding:'12px 8px',fontFamily:'Nunito',fontWeight:900,fontSize:'12px',cursor:'pointer',minWidth:'80px'}}>
            {isPlaying&&playMode==='both'?'⏹ Rok':'🔊 Dono'}
          </button>
        </div>
      </div>

      {/* CHAPTER CHIPS */}
      <div style={{padding:'0 18px 10px',fontSize:'12px',color:'var(--soft)',fontWeight:700}}>
        📂 {chap.emoji} {chap.title} • Hadith {hadithIdx+1} / {chap.ahadith.length}
      </div>

      {/* NAV */}
      <div style={{display:'flex',gap:'10px',padding:'0 18px 100px'}}>
        <button onClick={prevHadith} disabled={chapIdx===0&&hadithIdx===0}
          style={{flex:1,background:'var(--gp)',color:'var(--g)',border:'none',borderRadius:'12px',padding:'14px',fontFamily:'Nunito',fontWeight:800,fontSize:'13px',cursor:'pointer',opacity:chapIdx===0&&hadithIdx===0?0.4:1}}>
          ← Pehli Hadees
        </button>
        <button onClick={nextHadith} disabled={chapIdx===RIYAD_CHAPTERS.length-1&&hadithIdx===chap.ahadith.length-1}
          style={{flex:1,background:'var(--g)',color:'#fff',border:'none',borderRadius:'12px',padding:'14px',fontFamily:'Nunito',fontWeight:800,fontSize:'13px',cursor:'pointer',opacity:chapIdx===RIYAD_CHAPTERS.length-1&&hadithIdx===chap.ahadith.length-1?0.4:1}}>
          Agli Hadees →
        </button>
      </div>
    </>
  );

  // LIST VIEW
  return(
    <>
      <div className="lhdr">
        <button className="back-btn" onClick={()=>{stopAudio();onBack();}}>← Back</button>
        <div className="l-title">📗 Riyad-us-Saliheen</div>
        <div style={{marginLeft:'auto',fontSize:'11px',color:'var(--soft)',fontWeight:700}}>{totalAhadith} Ahadith</div>
      </div>

      {/* HERO */}
      <div style={{background:'linear-gradient(160deg,#0a2200,#16335E,#2C5C9E)',padding:'28px 20px',textAlign:'center',position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',inset:0,background:'radial-gradient(circle at 70% 30%,rgba(240,192,64,0.08),transparent 60%)'}}/>
        <div style={{fontFamily:'Amiri',fontSize:'32px',color:'var(--gl)',marginBottom:'6px',position:'relative'}}>رياض الصالحين</div>
        <div style={{color:'rgba(255,255,255,0.5)',fontSize:'11px',fontWeight:700,letterSpacing:1,marginBottom:'10px'}}>IMAM AN-NAWAWI رحمہ اللہ</div>
        <div style={{color:'rgba(255,255,255,0.7)',fontSize:'13px',lineHeight:1.6,maxWidth:'320px',margin:'0 auto',position:'relative'}}>
          Nekkon ke Baghon ki Kitab — {totalAhadith} minted ahadith, {RIYAD_CHAPTERS.length} chapters
        </div>
      </div>

      {/* CHAPTERS */}
      {RIYAD_CHAPTERS.map((ch,ci)=>(
        <div key={ch.key} style={{margin:'12px 18px',borderRadius:'18px',background:'#fff',boxShadow:'var(--sh)',overflow:'hidden',border:'1.5px solid var(--gp)'}}>
          <div style={{background:'linear-gradient(135deg,var(--gp),#fff)',padding:'14px 18px',display:'flex',alignItems:'center',gap:'10px',borderBottom:'1px solid #eee'}}>
            <div style={{fontSize:'26px'}}>{ch.emoji}</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:900,fontSize:'15px',color:'var(--g)'}}>{ch.title}</div>
              <div style={{fontSize:'12px',color:'var(--soft)',marginTop:'2px'}}>{ch.desc} • {ch.ahadith.length} ahadith</div>
            </div>
            <div style={{background:'var(--g)',color:'#fff',borderRadius:'10px',padding:'3px 10px',fontSize:'11px',fontWeight:900}}>Ch.{ch.num}</div>
          </div>
          {ch.ahadith.map((h,hi)=>(
            <div key={h.num} onClick={()=>openHadith(ci,hi)}
              style={{padding:'14px 18px',borderBottom:hi<ch.ahadith.length-1?'1px solid #f5f5f0':'none',cursor:'pointer',display:'flex',gap:'12px',alignItems:'flex-start',transition:'background 0.15s'}}
              onMouseEnter={e=>e.currentTarget.style.background='#f8fdf5'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              <div style={{background:'var(--gp)',color:'var(--g)',borderRadius:'8px',padding:'3px 8px',fontSize:'10px',fontWeight:900,flexShrink:0,marginTop:'2px'}}>{h.num}</div>
              <div style={{flex:1}}>
                <div style={{fontFamily:'Amiri',fontSize:'16px',color:'#1a3a00',direction:'rtl',textAlign:'right',lineHeight:1.8,marginBottom:'6px'}}>{h.arabic}</div>
                <div style={{fontFamily:'Amiri',fontSize:'14px',color:'var(--soft)',direction:'rtl',textAlign:'right',lineHeight:1.7,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{h.urdu}</div>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'6px'}}>
                  <div style={{fontSize:'10px',color:'#aaa',fontWeight:700}}>📚 {h.ref}</div>
                  <div style={{fontSize:'11px',color:'var(--g)',fontWeight:800}}>Parho →</div>
                </div>
              </div>
            </div>
          ))}
        </div>
      ))}
      <div style={{textAlign:'center',padding:'16px 20px 40px',fontSize:'12px',color:'var(--soft)'}}>
        <div style={{fontFamily:'Amiri',fontSize:'18px',color:'var(--g)',marginBottom:'6px'}}>جَزَاكَ اللَّهُ خَيْرًا</div>
        Allah aap ko behtar jazaa de — Riyad-us-Saliheen parh kar nek bano 🌿
      </div>
    </>
  );
}

        </div>
      )}
      <div className="names-grid">
        {NAMES_99.map((nm,i)=>(
          <div key={i} className="name-card" style={{border:sel===i?'1.5px solid #00695C':''}} onClick={()=>{setSel(i);speak(nm.a,'ar-SA')}}>
            <div className="name-num">{nm.n}</div>
            <div className="name-arabic">{nm.a}</div>
            <div className="name-trans">{nm.t}</div>
            <div className="name-meaning">{nm.m}</div>
          </div>
        ))}
      </div>
    </>
  );
}

/* ═══════ QURAN — SURAH LIST ═══════ */
function QuranMod({onBack}){
  const [surahs,setSurahs]=useState(null);
  const [error,setError]=useState(null);
  const [qari,setQari]=useState(()=>load('np_qari','ar.alafasy'));
  const [openSurah,setOpenSurah]=useState(null);
  const [resolvedEditions,setResolvedEditions]=useState(null); // {qariId: {identifier, bitrate}}

  useEffect(()=>{
    fetch('https://api.alquran.cloud/v1/surah')
      .then(r=>r.json())
      .then(d=>setSurahs(d.data))
      .catch(()=>setError(true));
  },[]);

  // Resolve real CDN identifiers + available bitrates for every Qari, once.
  useEffect(()=>{
    async function resolve(){
      try{
        const res = await fetch('https://cdn.islamic.network/quran/info/by-ayah/info.json');
        const info = await res.json(); // { "edition.identifier": { "192": true, "128": true, ... }, ... }
        const map = {};
        QARIS.forEach(q=>{
          // Try the identifier as-is first
          let chosenId = null;
          let chosenBitrate = null;
          const tryBitrates = ['128','64','192','48','40','32'];

          function pickBitrate(idKey){
            const entry = info[idKey];
            if(!entry) return null;
            for(const b of tryBitrates){ if(entry[b]) return b; }
            const keys = Object.keys(entry);
            return keys.length ? keys[0] : null;
          }

          if(info[q.id]){
            chosenId = q.id;
            chosenBitrate = pickBitrate(q.id);
          } else {
            // Search all known identifiers for one matching this reciter's keywords
            const allIds = Object.keys(info);
            const match = allIds.find(idKey =>
              idKey.startsWith('ar.') && q.keys.some(k => idKey.toLowerCase().includes(k))
            );
            if(match){ chosenId = match; chosenBitrate = pickBitrate(match); }
          }
          map[q.id] = chosenId ? { identifier: chosenId, bitrate: chosenBitrate || '128' } : null;
        });
        setResolvedEditions(map);
      }catch(e){
        // If resolution fails entirely, fall back to using ids as-is at 128kbps
        const map = {};
        QARIS.forEach(q=>{ map[q.id] = { identifier:q.id, bitrate:'128' }; });
        setResolvedEditions(map);
      }
    }
    resolve();
  },[]);

  function chooseQari(id){ setQari(id); save('np_qari', id); }

  const currentResolved = resolvedEditions ? resolvedEditions[qari] : null;

  if(openSurah!==null){
    return <SurahReader surahNum={openSurah} qari={qari} resolved={currentResolved} onBack={()=>setOpenSurah(null)}/>;
  }

  return(
    <>
      <div className="lhdr"><button className="back-btn" onClick={onBack}>← Back</button><div className="l-title">🎙️ Listen to Quran</div></div>

      <div className="qari-select-bar">
        {QARIS.map(q=>(
          <button key={q.id} className={`qari-chip ${qari===q.id?'active':''}`} onClick={()=>chooseQari(q.id)}>
            {q.name}{resolvedEditions && !resolvedEditions[q.id] ? ' ⚠️' : ''}
          </button>
        ))}
      </div>

      {resolvedEditions && currentResolved===null && (
        <div style={{margin:'12px 18px',background:'#FFF3E0',borderRadius:'12px',padding:'12px 16px',fontSize:'12px',color:'#7A5000'}}>
          ⚠️ Is Qari ka audio abhi CDN pe available nahi hai. Koi doosra Qari try karen.
        </div>
      )}

      {error && (
        <div style={{padding:'40px 20px',textAlign:'center',color:'var(--soft)'}}>
          ⚠️ Quran data load nahi hua. Internet check karo aur reload karo.
        </div>
      )}

      {!surahs && !error && (
        <div style={{padding:'40px 20px',textAlign:'center',color:'var(--soft)'}}>
          ⏳ Surah list load ho rahi hai...
        </div>
      )}

      {surahs && (
        <div className="surah-grid">
          {surahs.map(s=>(
            <div key={s.number} className="surah-card" onClick={()=>setOpenSurah(s.number)}>
              <div className="surah-num-badge">{s.number}</div>
              <div className="surah-card-info">
                <div className="surah-card-name">{s.englishName}</div>
                <div className="surah-card-arabic">{s.name}</div>
                <div className="surah-card-meta">{s.numberOfAyahs} Ayahs • {s.revelationType}</div>
              </div>
            </div>
          ))}
        </div>
      )}
    </>
  );
}

/* ═══════ QURAN — SURAH READER (TEXT + SYNCED AUDIO) ═══════ */
function SurahReader({surahNum, qari, resolved, onBack}){
  const [surah,setSurah]=useState(null);       // arabic
  const [urdu,setUrdu]=useState(null);          // ahmed raza khan / kanz-ul-iman translation ayahs
  const [english,setEnglish]=useState(null);    // english translation ayahs
  const [urduLabel,setUrduLabel]=useState('Urdu Translation');
  const [error,setError]=useState(null);
  const [currentAyah,setCurrentAyah]=useState(0); // index into ayahs array
  const [isPlaying,setIsPlaying]=useState(false);
  const [autoPlay,setAutoPlay]=useState(true);
  const [showTranslation,setShowTranslation]=useState(true);
  const audioRef=useRef(null);
  const ayahRefs=useRef([]);

  useEffect(()=>{
    setSurah(null);setUrdu(null);setEnglish(null);setError(null);setCurrentAyah(0);setIsPlaying(false);

    async function load(){
      try{
        // 1. Always get Arabic text (reliable, fixed edition)
        const arRes = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}`);
        const arData = await arRes.json();
        setSurah(arData.data);

        // 2. Find the best Urdu edition (prefer Ahmed Raza Khan / Kanz-ul-Iman if listed)
        let urduEdition = 'ur.jalandhry'; // safe fallback, always present
        let label = 'Urdu Translation';
        try{
          const editRes = await fetch('https://api.alquran.cloud/v1/edition/language/ur');
          const editData = await editRes.json();
          const list = editData.data || [];
          const raza = list.find(e =>
            (e.identifier||'').toLowerCase().includes('raza') ||
            (e.englishName||'').toLowerCase().includes('raza') ||
            (e.name||'').toLowerCase().includes('رضا') ||
            (e.englishName||'').toLowerCase().includes('kanz')
          );
          if(raza){ urduEdition = raza.identifier; label = raza.englishName || 'Kanz-ul-Iman (Ahmed Raza Khan)'; }
        }catch(e){ /* keep fallback */ }
        setUrduLabel(label);

        // 3. Fetch Urdu + English translations for this surah in parallel
        const [urRes, enRes] = await Promise.all([
          fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/${urduEdition}`).then(r=>r.json()).catch(()=>null),
          fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/en.sahih`).then(r=>r.json()).catch(()=>null),
        ]);
        if(urRes && urRes.data) setUrdu(urRes.data.ayahs);
        if(enRes && enRes.data) setEnglish(enRes.data.ayahs);
      }catch(e){
        setError(true);
      }
    }
    load();
  },[surahNum]);

  const qariMeta = QARIS.find(q=>q.id===qari) || QARIS[0];
  const audioIdentifier = (resolved && resolved.identifier) || qari;
  const FALLBACK_BITRATES = ['128','64','192','48','40','32'];
  const [bitrateIdx, setBitrateIdx] = useState(0);

  useEffect(()=>{
    // Reset bitrate fallback attempts whenever the qari/edition changes
    setBitrateIdx(0);
  },[audioIdentifier]);

  function currentBitrate(){
    if(resolved && resolved.bitrate && bitrateIdx===0) return resolved.bitrate;
    return FALLBACK_BITRATES[bitrateIdx] || '128';
  }

  function ayahAudioUrl(globalAyahNumber){
    return `https://cdn.islamic.network/quran/audio/${currentBitrate()}/${audioIdentifier}/${globalAyahNumber}.mp3`;
  }

  function playAyah(idx){
    if(!surah || !surah.ayahs[idx]) return;
    setCurrentAyah(idx);
    const url = ayahAudioUrl(surah.ayahs[idx].number);
    if(audioRef.current){
      audioRef.current.src = url;
      audioRef.current.play().then(()=>setIsPlaying(true)).catch(()=>setIsPlaying(false));
    }
    const el = ayahRefs.current[idx];
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  }

  function onAudioError(){
    // Try the next bitrate in the fallback chain before giving up
    if(bitrateIdx < FALLBACK_BITRATES.length-1){
      setBitrateIdx(b=>b+1);
      setTimeout(()=>{
        if(surah && surah.ayahs[currentAyah] && audioRef.current){
          audioRef.current.src = ayahAudioUrl(surah.ayahs[currentAyah].number);
          audioRef.current.play().catch(()=>setIsPlaying(false));
        }
      }, 100);
    } else {
      setIsPlaying(false);
      toast(`⚠️ ${qariMeta.name} ka audio is ayat ke liye available nahi hai.`);
    }
  }

  function togglePlayPause(){
    if(!audioRef.current) return;
    if(isPlaying){
      audioRef.current.pause();
      setIsPlaying(false);
    } else {
      if(!audioRef.current.src || audioRef.current.src==='') playAyah(currentAyah);
      else audioRef.current.play().then(()=>setIsPlaying(true)).catch(()=>{});
    }
  }

  function onAudioEnded(){
    if(autoPlay && surah && currentAyah < surah.ayahs.length-1){
      playAyah(currentAyah+1);
    } else {
      setIsPlaying(false);
    }
  }

  function nextAyah(){ if(surah && currentAyah<surah.ayahs.length-1) playAyah(currentAyah+1); }
  function prevAyah(){ if(currentAyah>0) playAyah(currentAyah-1); }

  if(error) return (
    <>
      <div className="lhdr"><button className="back-btn" onClick={onBack}>← Back</button><div className="l-title">🎙️ Quran Reader</div></div>
      <div style={{padding:'40px 20px',textAlign:'center',color:'var(--soft)'}}>⚠️ Surah load nahi hua. Internet check karo.</div>
    </>
  );

  if(!surah) return (
    <>
      <div className="lhdr"><button className="back-btn" onClick={onBack}>← Back</button><div className="l-title">🎙️ Quran Reader</div></div>
      <div style={{padding:'40px 20px',textAlign:'center',color:'var(--soft)'}}>⏳ Loading Surah {surahNum}...</div>
    </>
  );

  return(
    <>
      <div className="lhdr">
        <button className="back-btn" onClick={onBack}>← Back</button>
        <div className="l-title">{surah.englishName} — {surah.name}</div>
      </div>

      <div style={{padding:'16px 20px',background:'#fff',borderBottom:'1px solid #f0f0f0',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'8px'}}>
        <div style={{fontSize:'12px',color:'var(--soft)',fontWeight:700}}>🎙️ Qari: {qariMeta.name}</div>
        <div style={{display:'flex',gap:'14px',flexWrap:'wrap'}}>
          <label style={{fontSize:'12px',color:'var(--soft)',fontWeight:700,display:'flex',alignItems:'center',gap:'6px',cursor:'pointer'}}>
            <input type="checkbox" checked={showTranslation} onChange={e=>setShowTranslation(e.target.checked)}/> Show translation
          </label>
          <label style={{fontSize:'12px',color:'var(--soft)',fontWeight:700,display:'flex',alignItems:'center',gap:'6px',cursor:'pointer'}}>
            <input type="checkbox" checked={autoPlay} onChange={e=>setAutoPlay(e.target.checked)}/> Auto-play next ayah
          </label>
        </div>
      </div>

      <div style={{paddingBottom:'90px'}}>
        {surah.ayahs.map((ayah,idx)=>(
          <div
            key={ayah.number}
            ref={el=>ayahRefs.current[idx]=el}
            className={`ayah-block ${idx===currentAyah?'playing':''}`}
            onClick={()=>playAyah(idx)}
          >
            <div className="ayah-arabic-text">
              {ayah.text}
              <span className="ayah-num-circle">{ayah.numberInSurah}</span>
            </div>
            {showTranslation && (
              <div style={{marginTop:'10px'}}>
                {urdu && urdu[idx] && (
                  <div style={{fontFamily:'Amiri,serif',fontSize:'16px',color:'var(--pur)',direction:'rtl',textAlign:'right',lineHeight:'1.9',marginBottom:'6px'}}>
                    {urdu[idx].text}
                  </div>
                )}
                {english && english[idx] && (
                  <div style={{fontSize:'13px',color:'var(--soft)',lineHeight:'1.7'}}>
                    {english[idx].text}
                  </div>
                )}
                {!urdu && !english && (
                  <div style={{fontSize:'12px',color:'#bbb'}}>⏳ Translation loading...</div>
                )}
              </div>
            )}
          </div>
        ))}
      </div>

      <div style={{textAlign:'center',padding:'8px',fontSize:'10px',color:'var(--soft)'}}>
        Urdu: {urduLabel} • English: Sahih International
      </div>

      <div className="reader-player-bar">
        <button className="player-btn" onClick={prevAyah} style={{width:'38px',height:'38px',fontSize:'14px',background:'rgba(255,255,255,0.15)',color:'#fff'}}>⏮</button>
        <button className="player-btn" onClick={togglePlayPause}>{isPlaying ? '⏸' : '▶'}</button>
        <div className="player-info">
          <div className="player-surah-name">Ayah {surah.ayahs[currentAyah]?.numberInSurah} / {surah.ayahs.length}</div>
          <div className="player-qari-name">{qariMeta.name}</div>
        </div>
        <button className="player-btn" onClick={nextAyah} style={{width:'38px',height:'38px',fontSize:'14px',background:'rgba(255,255,255,0.15)',color:'#fff'}}>⏭</button>
      </div>

      <audio ref={audioRef} onEnded={onAudioEnded} onPause={()=>setIsPlaying(false)} onPlay={()=>setIsPlaying(true)} onError={onAudioError}/>
    </>
  );
}

const TASBEEH_PRESETS = [
  {name:'SubhanAllah', arabic:'سُبْحَانَ اللّٰهِ', target:33},
  {name:'Alhamdulillah', arabic:'اَلْحَمْدُ لِلّٰهِ', target:33},
