  {name:'La ilaha illallah', arabic:'لَا إِلٰهَ إِلَّا اللّٰهُ', target:100},
  {name:'Free Count', arabic:'', target:0},
];

function TasbeehMod({onBack}){
  const [presetIdx,setPresetIdx]=useState(()=>load('np_tasbeeh_preset',0));
  const [count,setCount]=useState(()=>load('np_tasbeeh_count_'+presetIdx,0));
  const preset = TASBEEH_PRESETS[presetIdx];

  useEffect(()=>{
    setCount(load('np_tasbeeh_count_'+presetIdx,0));
  },[presetIdx]);

  function increment(){
    const n = count+1;
    setCount(n);
    save('np_tasbeeh_count_'+presetIdx,n);
    if(navigator.vibrate) navigator.vibrate(15);
    if(preset.target>0 && n===preset.target){
      toast(`✅ ${preset.target} mukammal! Masha Allah!`);
      if(navigator.vibrate) navigator.vibrate([50,50,50]);
    }
  }
  function reset(){
    setCount(0);
    save('np_tasbeeh_count_'+presetIdx,0);
  }
  function choosePreset(i){
    setPresetIdx(i);
    save('np_tasbeeh_preset',i);
  }

  return(
    <>
      <div className="lhdr"><button className="back-btn" onClick={onBack}>← Back</button><div className="l-title">📿 Tasbeeh Counter</div></div>
      <div className="tasbeeh-wrap">
        <div className="tasbeeh-presets">
          {TASBEEH_PRESETS.map((p,i)=>(
            <button key={i} className={`tasbeeh-preset-chip ${presetIdx===i?'active':''}`} onClick={()=>choosePreset(i)}>{p.name}</button>
          ))}
        </div>
        <div className="tasbeeh-display">
          {preset.arabic && <div className="tasbeeh-dhikr-arabic">{preset.arabic}</div>}
          <div className="tasbeeh-dhikr-name">{preset.name}</div>
          <div className="tasbeeh-count">{count}</div>
          {preset.target>0 && <div className="tasbeeh-target">Target: {preset.target} {count>=preset.target?'✅':`(${preset.target-count} baaki)`}</div>}
        </div>
        <button className="tasbeeh-btn" onClick={increment}>TAP<br/>KAREN</button>
        <div><button className="tasbeeh-reset" onClick={reset}>🔄 Reset</button></div>
      </div>
    </>
  );
}

/* ═══════ QIBLA COMPASS ═══════ */
function QiblaMod({onBack}){
  const [heading,setHeading]=useState(null);
  const [qiblaDirection,setQiblaDirection]=useState(null);
  const [error,setError]=useState(null);
  const [permissionAsked,setPermissionAsked]=useState(false);

  // Kaaba coordinates
  const KAABA_LAT = 21.4225;
  const KAABA_LNG = 39.8262;

  function calculateQiblaBearing(lat,lng){
    const phiK = KAABA_LAT * Math.PI/180;
    const lambdaK = KAABA_LNG * Math.PI/180;
    const phi = lat * Math.PI/180;
    const lambda = lng * Math.PI/180;
    const psi = Math.atan2(
      Math.sin(lambdaK-lambda),
      Math.cos(phi)*Math.tan(phiK) - Math.sin(phi)*Math.cos(lambdaK-lambda)
    );
    let bearing = psi * 180/Math.PI;
    return (bearing+360)%360;
  }

  function requestLocationAndOrientation(){
    setPermissionAsked(true);
    if(!navigator.geolocation){
      setError('Location access is browser mein available nahi hai.');
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos)=>{
        const bearing = calculateQiblaBearing(pos.coords.latitude,pos.coords.longitude);
        setQiblaDirection(bearing);
      },
      ()=>{ setError('Location permission allow nahi hui. Browser settings mein location ON karen.'); },
      {enableHighAccuracy:true}
    );

    if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission().then(state=>{
        if(state==='granted'){
          window.addEventListener('deviceorientationabsolute', handleOrientation, true);
          window.addEventListener('deviceorientation', handleOrientation, true);
        }
      }).catch(()=>{});
    } else {
      window.addEventListener('deviceorientationabsolute', handleOrientation, true);
      window.addEventListener('deviceorientation', handleOrientation, true);
    }
  }

  function handleOrientation(e){
    let h = null;
    if(e.webkitCompassHeading !== undefined){
      // iOS Safari — already correct, clockwise from North
      h = e.webkitCompassHeading;
    } else if(e.alpha != null){
      // Android: 'absolute' events give alpha already clockwise from North.
      // Non-absolute fallback events need inverting.
      h = e.absolute ? e.alpha : (360 - e.alpha);
    }
    if(h!=null) setHeading(h);
  }

  useEffect(()=>{
    return ()=>{
      window.removeEventListener('deviceorientationabsolute', handleOrientation, true);
      window.removeEventListener('deviceorientation', handleOrientation, true);
    };
  },[]);

  const [sensorTimeout,setSensorTimeout]=useState(false);

  useEffect(()=>{
    if(!permissionAsked) return;
    const t = setTimeout(()=>{ if(heading==null) setSensorTimeout(true); }, 4000);
    return ()=>clearTimeout(t);
  },[permissionAsked,heading]);

  const needleRotation = (qiblaDirection!=null && heading!=null) ? (qiblaDirection - heading) : (qiblaDirection || 0);

  // Force a smooth needle transition only when sensor is active
  const needleStyle = {
    transform:`rotate(${needleRotation}deg)`,
    transition: heading!=null ? 'transform 0.25s ease-out' : 'none'
  };

  return(
    <>
      <div className="lhdr"><button className="back-btn" onClick={onBack}>← Back</button><div className="l-title">🧭 Qibla Compass</div></div>
      <div className="qibla-wrap">
        {!permissionAsked && (
          <button onClick={requestLocationAndOrientation} style={{width:'100%',background:'var(--g)',color:'#fff',border:'none',borderRadius:'14px',padding:'16px',fontFamily:'Nunito',fontWeight:900,fontSize:'15px',cursor:'pointer',marginTop:'20px'}}>📍 Location Access Den — Qibla Dhoondein</button>
        )}
        {error && <div style={{marginTop:'16px',background:'#FFEBEE',color:'#C62828',borderRadius:'12px',padding:'14px',fontSize:'13px'}}>⚠️ {error}</div>}
        {qiblaDirection!=null && !error && (
          <>
            <div className="qibla-compass-ring">
              <div className="qibla-needle" style={needleStyle}></div>
              <div className="qibla-kaaba-icon">🕋</div>
            </div>
            <div className="qibla-degree">{Math.round(qiblaDirection)}°{heading!=null && <span style={{fontSize:'13px',color:'var(--soft)',marginLeft:'8px'}}>(sensor: {Math.round(heading)}°)</span>}</div>
            <div className="qibla-info-box">
              {heading!=null
                ? '📱 Phone ko ghumayen jab tak 🕋 icon upar na aaye — wahi Qibla ki sahi disha hai.'
                : '⚠️ Compass sensor detect nahi hua. Upar diya gaya degree (°) North se Qibla ka angle hai — ek physical compass app se match kar len.'}
            </div>
            {sensorTimeout && heading==null && (
              <div style={{marginTop:'12px',background:'#FFF9E6',color:'#7A5C00',borderRadius:'12px',padding:'14px',fontSize:'12px',lineHeight:1.6}}>
                💡 <strong>Sensor data nahi aa raha?</strong> Chrome mein motion-sensor permission block ho sakti hai:<br/>
                Chrome menu (⋮) → Site settings (URL ke pass lock icon par tap karke bhi milta hai) → "Motion sensors" dhoondein → Allow karein, phir page reload karein.
              </div>
            )}
          </>
        )}
      </div>
    </>
  );
}

/* ═══════ ISLAMIC CALENDAR ═══════ */
function IslamicCalendarMod({onBack}){
  const [hijri,setHijri] = useState(null);
  const [error,setError] = useState(null);
  const [viewDate,setViewDate] = useState(()=>{ const d=new Date(); d.setDate(1); return d; });
  const [monthDays,setMonthDays] = useState(null);
  const [monthLoading,setMonthLoading] = useState(false);

  useEffect(()=>{
    const today = new Date();
    const dd = String(today.getDate()).padStart(2,'0');
    const mm = String(today.getMonth()+1).padStart(2,'0');
    const yyyy = today.getFullYear();
    fetch(`https://api.aladhan.com/v1/gToH/${dd}-${mm}-${yyyy}`)
      .then(r=>r.json())
      .then(d=>setHijri(d.data.hijri))
      .catch(()=>setError(true));
  },[]);

  useEffect(()=>{
    setMonthLoading(true);
    const m = viewDate.getMonth()+1;
    const y = viewDate.getFullYear();
    fetch(`https://api.aladhan.com/v1/gToHCalendar/${m}/${y}`)
      .then(r=>r.json())
      .then(d=>{ setMonthDays(d.data); setMonthLoading(false); })
      .catch(()=>{ setMonthDays(null); setMonthLoading(false); });
  },[viewDate]);

  const HIJRI_MONTH_NUM = {'Muharram':1,'Safar':2,'Rabi al-Awwal':3,"Rabi' al-thani":4,'Jumada al-awwal':5,'Jumada al-thani':6,'Rajab':7,"Sha'ban":8,'Ramadan':9,'Shawwal':10,"Dhu al-Qi'dah":11,'Dhu al-Hijjah':12};

  const ISLAMIC_EVENTS = [
    {name:'Muharram (Islamic New Year)', day:1, month:1},
    {name:'Ashura', day:10, month:1},
    {name:'Mawlid an-Nabi ﷺ', day:12, month:3},
    {name:'Isra & Mi\'raj', day:27, month:7},
    {name:'Sha\'ban (Mid-month)', day:15, month:8},
    {name:'Ramadan Begins', day:1, month:9},
    {name:'Laylat al-Qadr (estimated)', day:27, month:9},
    {name:'Eid al-Fitr', day:1, month:10},
    {name:'Hajj — Day of Arafah', day:9, month:12},
    {name:'Eid al-Adha', day:10, month:12},
  ];

  function eventFor(hijriDay,hijriMonthNum){
    return ISLAMIC_EVENTS.find(e=>e.day===hijriDay && e.month===hijriMonthNum);
  }

  function changeMonth(delta){
    setViewDate(d=>{ const nd=new Date(d); nd.setMonth(nd.getMonth()+delta); return nd; });
  }

  const todayStr = new Date().toDateString();
  const monthEvents = monthDays ? monthDays.map(d=>{
    const hm = HIJRI_MONTH_NUM[d.hijri.month.en] || d.hijri.month.number;
    const ev = eventFor(parseInt(d.hijri.day,10), hm);
    return ev ? {...ev, gregorian:d.gregorian.date, weekday:d.gregorian.weekday.en} : null;
  }).filter(Boolean) : [];

  return(
    <>
      <div className="lhdr"><button className="back-btn" onClick={onBack}>← Back</button><div className="l-title">📅 Islamic Calendar</div></div>
      <div className="cal-wrap">
        <div className="cal-hijri-card">
          {error && <div style={{color:'rgba(255,255,255,0.6)',fontSize:'13px'}}>⚠️ Hijri date load nahi hui. Internet check karen.</div>}
          {!hijri && !error && <div style={{color:'rgba(255,255,255,0.6)',fontSize:'13px'}}>⏳ Loading...</div>}
          {hijri && (
            <>
              <div className="cal-hijri-date">{hijri.day} {hijri.month.en} {hijri.year} AH</div>
              <div className="cal-hijri-sub">{hijri.month.ar} — {hijri.weekday.en}</div>
              <div className="cal-gregorian">{new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
            </>
          )}
        </div>

        <div className="cal-month-nav">
          <button className="cal-nav-btn" onClick={()=>changeMonth(-1)}>‹</button>
          <div className="cal-month-title">{viewDate.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</div>
          <button className="cal-nav-btn" onClick={()=>changeMonth(1)}>›</button>
        </div>

        {monthLoading && <div style={{textAlign:'center',padding:'20px',color:'var(--soft)',fontSize:'13px'}}>⏳ Loading calendar...</div>}

        {!monthLoading && monthDays && (
          <div className="cal-grid">
            {['S','M','T','W','T','F','S'].map((d,i)=><div key={i} className="cal-grid-head">{d}</div>)}
            {Array.from({length:new Date(viewDate.getFullYear(),viewDate.getMonth(),1).getDay()}).map((_,i)=><div key={'b'+i}/>)}
            {monthDays.map((d,i)=>{
              const isToday = new Date(d.gregorian.date.split('-').reverse().join('-')).toDateString()===todayStr;
              const hm = HIJRI_MONTH_NUM[d.hijri.month.en] || d.hijri.month.number;
              const ev = eventFor(parseInt(d.hijri.day,10), hm);
              return (
                <div key={i} className={`cal-cell ${isToday?'cal-cell-today':''} ${ev?'cal-cell-event':''}`} title={ev?ev.name:''}>
                  <div className="cal-cell-g">{d.gregorian.day}</div>
                  <div className="cal-cell-h">{d.hijri.day}</div>
                  {ev && <div className="cal-cell-dot"/>}
                </div>
              );
            })}
          </div>
        )}

        <div className="cal-events-list">
          <div style={{fontWeight:900,fontSize:'15px',color:'var(--g)',marginBottom:'12px'}}>🌙 Is Mahine Ke Ahem Islamic Din</div>
          {monthEvents.length===0 && !monthLoading && <div style={{fontSize:'13px',color:'var(--soft)'}}>Is mahine koi bada Islamic din nahi hai.</div>}
          {monthEvents.map((e,i)=>(
            <div key={i} className="cal-event-item">
              <div className="cal-event-name">{e.name}</div>
              <div className="cal-event-date">{e.weekday}, {e.gregorian}</div>
            </div>
          ))}
        </div>
        <div style={{textAlign:'center',padding:'14px',fontSize:'11px',color:'var(--soft)'}}>
          💡 Exact dates moon-sighting par depend karti hain aur 1-2 din aage-peeche ho sakti hain.
        </div>
      </div>
    </>
  );
}

/* ═══════ PRAYER TIMES ═══════ */
function PrayerTimesMod({onBack}){
  const [times,setTimes] = useState(null);
  const [locationName,setLocationName] = useState(null);
  const [error,setError] = useState(null);
  const [now,setNow] = useState(Date.now());

  useEffect(()=>{
    const t = setInterval(()=>setNow(Date.now()),30000);
    return ()=>clearInterval(t);
  },[]);

  useEffect(()=>{
    if(!navigator.geolocation){
      setError('Location access available nahi hai.');
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos)=>{
        const {latitude,longitude} = pos.coords;
        fetch(`https://api.aladhan.com/v1/timings?latitude=${latitude}&longitude=${longitude}&method=2`)
          .then(r=>r.json())
          .then(d=>setTimes(d.data.timings))
          .catch(()=>setError('Prayer times load nahi hue. Internet check karen.'));
        fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json`)
          .then(r=>r.json())
          .then(d=>setLocationName(d.address?.city || d.address?.town || d.address?.county || 'Aapki Location'))
          .catch(()=>setLocationName('Aapki Location'));
      },
      ()=>{ setError('Location permission allow nahi hui. Settings mein location ON karen.'); },
      {enableHighAccuracy:true}
    );
  },[]);

  const PRAYER_ORDER = [
    {key:'Fajr',label:'Fajr',emoji:'🌅'},
    {key:'Sunrise',label:'Sunrise',emoji:'☀️'},
    {key:'Dhuhr',label:'Zuhr',emoji:'🌞'},
    {key:'Asr',label:'Asr',emoji:'🌤️'},
    {key:'Maghrib',label:'Maghrib',emoji:'🌇'},
    {key:'Isha',label:'Isha',emoji:'🌙'},
  ];

  function timeToMinutes(t){
    const [h,m] = t.split(':').map(Number);
    return h*60+m;
  }
  function getNextPrayer(){
    if(!times) return null;
    const nowMin = new Date().getHours()*60 + new Date().getMinutes();
    for(const p of PRAYER_ORDER){
      if(p.key==='Sunrise') continue;
      const pMin = timeToMinutes(times[p.key]);
      if(pMin > nowMin) return p.key;
    }
    return 'Fajr'; // next day
  }
  function formatCountdown(){
    if(!times) return '';
    const nextKey = getNextPrayer();
    const nowMin = new Date().getHours()*60 + new Date().getMinutes();
    let targetMin = timeToMinutes(times[nextKey]);
    let diff = targetMin - nowMin;
    if(diff<0) diff += 24*60;
    const h = Math.floor(diff/60), m = diff%60;
    return `${h}h ${m}m`;
  }

  const nextPrayer = times ? getNextPrayer() : null;

  return(
    <>
      <div className="lhdr"><button className="back-btn" onClick={onBack}>← Back</button><div className="l-title">🕌 Prayer Times</div></div>
      <div className="prayer-wrap">
        {error && <div style={{background:'#FFEBEE',color:'#C62828',borderRadius:'12px',padding:'14px',fontSize:'13px',marginBottom:'14px'}}>⚠️ {error}</div>}
        {!times && !error && <div style={{textAlign:'center',padding:'30px',color:'var(--soft)'}}>⏳ Location aur prayer times load ho rahe hain...</div>}
        {times && (
          <>
            <div className="prayer-location-box">
              <span>📍 {locationName || 'Loading...'}</span>
              <span>{new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</span>
            </div>
            <div className="prayer-countdown-card">
              <div style={{fontSize:'13px',opacity:0.85}}>Agli Namaz: {PRAYER_ORDER.find(p=>p.key===nextPrayer)?.label}</div>
              <div style={{fontSize:'28px',fontWeight:900,marginTop:'4px'}}>{formatCountdown()}</div>
            </div>
            <div className="prayer-times-list">
              {PRAYER_ORDER.map(p=>(
                <div key={p.key} className={`prayer-time-row ${p.key===nextPrayer?'next-prayer':''}`}>
                  <div className="prayer-name">{p.emoji} {p.label}</div>
                  <div className="prayer-time-val">{times[p.key]}</div>
                </div>
              ))}
            </div>
            <div style={{textAlign:'center',padding:'14px',fontSize:'11px',color:'var(--soft)'}}>
              ⚙️ Calculation method: University of Islamic Sciences, Karachi
            </div>
          </>
        )}
      </div>
    </>
  );
}

/* ═══════ AI RECITATION CHECKER (Beta — uses browser's free Speech Recognition) ═══════ */
const RECITE_PRACTICE_AYAHS = [
  {arabic:'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ', translit:'Bismillahir Rahmanir Raheem', keywords:['bismillah','rahman','raheem']},
  {arabic:'الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ', translit:'Alhamdu lillahi Rabbil Alameen', keywords:['alhamdu','lillahi','rabbil','alameen']},
  {arabic:'إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ', translit:'Iyyaka na\'budu wa iyyaka nasta\'een', keywords:['iyyaka','nabudu','nastaeen']},
  {arabic:'قُلْ هُوَ اللَّهُ أَحَدٌ', translit:'Qul Huwallahu Ahad', keywords:['qul','huwallahu','ahad']},
];

function RecitationCheckerMod({onBack}){
  const [idx,setIdx] = useState(0);
  const [listening,setListening] = useState(false);
  const [transcript,setTranscript] = useState('');
  const [result,setResult] = useState(null); // {score, message}
  const mediaRecRef = useRef(null);
  const streamRef = useRef(null);
  const chunksRef = useRef([]);
  const ayah = RECITE_PRACTICE_AYAHS[idx];
  const supported = typeof window!=='undefined' && navigator.mediaDevices && window.MediaRecorder;

  async function startListening(){
    if(!supported){
      toast('⚠️ Aapka browser microphone recording support nahi karta.');
      return;
    }
    setTranscript('');
    setResult(null);
    try{
      streamRef.current = await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(e){
      toast('⚠️ Microphone permission allow nahi hui.');
      return;
    }
    chunksRef.current = [];
    const rec = new MediaRecorder(streamRef.current);
    rec.ondataavailable = e=>chunksRef.current.push(e.data);
    rec.onstop = async ()=>{
      streamRef.current.getTracks().forEach(t=>t.stop());
      setListening(false);
      const blob = new Blob(chunksRef.current,{type:chunksRef.current[0]?.type||'audio/webm'});
      await transcribeAndEvaluate(blob);
    };
    mediaRecRef.current = rec;
    rec.start();
    setListening(true);
  }

  function stopListening(){
    if(mediaRecRef.current && listening){
      try{ mediaRecRef.current.stop(); }catch(e){}
    }
  }

  async function transcribeAndEvaluate(blob){
    setTranscript('⏳ Sun raha hoon...');
    try{
      const fd = new FormData();
      fd.append('mode','transcribe');
      fd.append('audio', blob, 'recitation.webm');
      const res = await fetch(AI_WORKER_URL,{method:'POST',body:fd});
      const data = await res.json();
      if(data.error){ toast('⚠️ '+data.error.message); setTranscript(''); return; }
      const text = data.transcript || '';
      setTranscript(text);
      evaluateAttempt(text);
    }catch(e){
      toast('⚠️ Network error. Dobara try karen.');
      setTranscript('');
    }
  }

  function evaluateAttempt(text){
    const normalized = text.toLowerCase();
    let matchedKeywords = 0;
    ayah.keywords.forEach(k=>{
      // Loose match since Arabic speech-to-text transliteration varies a lot
      if(normalized.includes(k.slice(0,4))) matchedKeywords++;
    });
    const score = Math.round((matchedKeywords/ayah.keywords.length)*100);
    if(score>=60){
      setResult({score,good:true,message:'✅ Acha try kiya! Tilawat sunai di.'});
    } else {
      setResult({score,good:false,message:'🔄 Thoda alag suna. Dobara dheere aur saaf parhne ki koshish karen.'});
    }
  }

  function nextAyah(){
    setIdx(i=>(i+1)%RECITE_PRACTICE_AYAHS.length);
    setTranscript('');
    setResult(null);
  }

  return(
    <>
      <div className="lhdr"><button className="back-btn" onClick={onBack}>← Back</button><div className="l-title">🎙️ Recitation Checker (Beta)</div></div>

      <div className="fiqh-disclaimer" style={{marginBottom:'4px'}}>
        ⚠️ <strong>Beta feature:</strong> Ye tool browser ki basic free voice-recognition technology use karta hai — ye sirf ek <em>mota-mota andaza</em> deta hai ke aapne ayah parhi ya nahi, lekin professional Tajweed-correction jaisa precise nahi hai. Sahi Tajweed ke liye humara Tajweed module aur kisi Qari/Ustad se seekhna zaroori hai.
      </div>

      <div className="recite-wrap">
        <div className="recite-ayah-card">
          <div className="recite-ayah-arabic">{ayah.arabic}</div>
          <div style={{fontSize:'13px',color:'var(--soft)'}}>{ayah.translit}</div>
        </div>

        {!supported && (
          <div style={{background:'#FFF3E0',color:'#E65100',borderRadius:'12px',padding:'14px',fontSize:'13px',marginBottom:'16px'}}>
            ⚠️ Aapka browser voice recognition support nahi karta. Chrome browser try karen.
          </div>
        )}

        <button className={`recite-mic-btn ${listening?'listening':''}`} onClick={listening?stopListening:startListening} disabled={!supported}>
          🎙️
        </button>
        <div style={{fontSize:'12px',color:'var(--soft)',marginTop:'10px'}}>{listening ? 'Sun raha hoon... Ab parhen' : 'Mic dabakar upar wali ayah parhen'}</div>

        {transcript && (
          <div className="recite-transcript">"{transcript}" (jo suna gaya)</div>
        )}

        {result && (
          <div className={`recite-result-box ${result.good?'recite-result-good':'recite-result-bad'}`}>
            {result.message}
          </div>
        )}

        <div style={{display:'flex',gap:'10px',marginTop:'20px'}}>
          <button onClick={nextAyah} style={{flex:1,background:'var(--gp)',color:'var(--g)',border:'none',borderRadius:'12px',padding:'12px',fontFamily:'Nunito',fontWeight:800,cursor:'pointer'}}>Next Ayah →</button>
        </div>
      </div>
    </>
  );
}

/* ═══════ QUIZ ═══════ */
function QuizMod({onBack,onProgress}){
  const allQ=[
    ...ARABIC.slice(0,14).map(a=>({q:'What is this Arabic letter?',d:a.l,ans:a.n,opts:shuffle([a.n,...shuffle(ARABIC.filter(x=>x.n!==a.n)).slice(0,3).map(x=>x.n)]),type:'ar'})),
    ...ENGLISH.slice(0,10).map(a=>({q:'What word starts with this letter?',d:a.l,ans:a.ex.split(' ')[0],opts:shuffle([a.ex.split(' ')[0],...shuffle(ENGLISH.filter(x=>x.l!==a.l)).slice(0,3).map(x=>x.ex.split(' ')[0])]),type:'e'})),
    ...PILLARS.map(p=>({q:'What is this pillar of Islam?',d:p.emoji,ans:p.name.split('—')[0].trim(),opts:shuffle([p.name.split('—')[0].trim(),...shuffle(PILLARS.filter(x=>x.n!==p.n)).slice(0,3).map(x=>x.name.split('—')[0].trim())]),type:'p'})),
  ];
  const [questions]=useState(()=>shuffle(allQ).slice(0,12));
  const [cur,setCur]=useState(0);
  const [score,setScore]=useState(0);
  const [chosen,setChosen]=useState(null);
  const [done,setDone]=useState(false);

  function pick(opt){
    if(chosen)return;
    setChosen(opt);
    if(opt===questions[cur].ans){setScore(s=>s+1);speak('Excellent! Masha Allah!','en-US');toast('🌟 Correct! Masha Allah!')}
    else{speak('Try again!','en-US');toast('💪 Try Again!')}
    setTimeout(()=>{
      if(cur+1>=questions.length){setDone(true);onProgress('quiz',score+1)}
      else{setCur(c=>c+1);setChosen(null)}
    },1300);
  }
  function restart(){setCur(0);setScore(0);setChosen(null);setDone(false)}

  if(done)return(
    <>
      <div className="lhdr"><button className="back-btn" onClick={onBack}>← Back</button><div className="l-title">🎯 Quiz Complete!</div></div>
      <div className="q-score-wrap">
        <div style={{fontSize:'64px'}}>{score>=10?'🌟':score>=7?'⭐':'💪'}</div>
        <div className="q-score-num">{score}/{questions.length}</div>
        <div className="q-msg">{score>=10?'Masha Allah! Perfect!':score>=7?'Great job! Keep going!':'Keep practicing!'}</div>
        <div style={{marginTop:'20px',display:'flex',gap:'12px',justifyContent:'center',flexWrap:'wrap'}}>
          <button onClick={restart} style={{background:'var(--g)',color:'#fff',border:'none',borderRadius:'14px',padding:'13px 24px',fontFamily:'Nunito',fontWeight:900,cursor:'pointer',fontSize:'15px'}}>🔄 Play Again</button>
          <button onClick={onBack} style={{background:'var(--gp)',color:'var(--g)',border:'none',borderRadius:'14px',padding:'13px 24px',fontFamily:'Nunito',fontWeight:900,cursor:'pointer',fontSize:'15px'}}>🏠 Home</button>
        </div>
      </div>
    </>
  );

  const q=questions[cur];
  return(
    <>
      <div className="lhdr"><button className="back-btn" onClick={onBack}>← Back</button><div className="l-title">🎯 Question {cur+1}/{questions.length} — ⭐ {score}</div></div>
      <div className="quiz-wrap">
        <div className="q-prog"><div className="q-fill" style={{width:`${(cur/questions.length)*100}%`}}></div></div>
        <div style={{fontWeight:800,fontSize:'16px',marginBottom:'8px'}}>{q.q}</div>
        <div className={`q-display ${q.type==='e'?'e':''}`} style={q.type==='p'?{fontSize:'48px',fontFamily:'Nunito'}:{}}>{q.d}</div>
        <div className="q-opts">
          {q.opts.map((opt,i)=>(
            <button key={i} className={`q-opt${chosen?(opt===q.ans?' ok':opt===chosen?' bad':''):''}`} onClick={()=>pick(opt)}>{opt}</button>
          ))}
        </div>
      </div>
    </>
  );
}

      grantAdminAccess();
    } else {
      setAdminError('❌ Galat PIN. Dobara try karo.');
    }
  }

  function startRazorpay(){
    if(typeof Razorpay === 'undefined'){
      alert('⚠️ Payment system load nahi hua. Internet check karo aur reload karo.');
      return;
    }
    setLoading(true);
    try{
      const options = {
        key: RZP_KEY,
        amount: HOUR_PRICE_PAISE,
        currency: 'INR',
        name: 'NoorPath',
        description: '1 Hour Learning Access',
        theme: { color: '#16335E' },
        prefill: {},
        notes: { type: 'hourly_access' },
        handler: function(response){
          // This callback ONLY fires after Razorpay confirms a successful, verified payment.
          // response.razorpay_payment_id is proof of a real, completed transaction.
          if(response && response.razorpay_payment_id){
            unlockOneHour(response.razorpay_payment_id);
          } else {
            setLoading(false);
            alert('⚠️ Payment verification failed. Access nahi diya gaya.');
          }
        },
        modal: { ondismiss: function(){ setLoading(false); } }
      };
      const rzp = new Razorpay(options);
      rzp.on('payment.failed', function(resp){
        setLoading(false);
        alert('❌ Payment failed: '+resp.error.description+'\n\nAccess nahi diya jaayega.');
      });
      rzp.open();
    }catch(e){
      setLoading(false);
      alert('❌ Error: '+e.message);
    }
  }

  function unlockOneHour(paymentId){
    const now = Date.now();
    const expiresAt = now + (60*60*1000); // 1 hour from now
    const session = {
      unlockedAt: now,
      expiresAt: expiresAt,
      paymentId: paymentId,
      amount: HOUR_PRICE_RUPEES
    };
    save('np_access', session);
    // Log payment history
    const history = load('np_payment_history', []);
    history.push({...session, date: new Date().toISOString()});
    save('np_payment_history', history);
    setLoading(false);
    toast('✅ 1 Hour Unlocked! Masha Allah, Happy Learning!');
    onUnlock(session, false);
  }

  return(
    <div style={{minHeight:'100vh',background:'linear-gradient(160deg,var(--night),#0f2d1a)',display:'flex',alignItems:'center',justifyContent:'center',padding:'24px'}}>
      <div style={{background:'#fff',borderRadius:'28px',padding:'36px',maxWidth:'420px',width:'100%',textAlign:'center',boxShadow:'0 30px 80px rgba(0,0,0,0.4)'}}>
        <div style={{fontSize:'56px',marginBottom:'12px'}}>🕐</div>
        <div style={{fontSize:'22px',fontWeight:900,color:'var(--text)',marginBottom:'6px'}}>
          {reason==='expired' ? 'Your 1 Hour Khatam Ho Gaya!' : 'NoorPath — Pay Per Hour'}
        </div>
        <div style={{fontSize:'14px',color:'var(--soft)',marginBottom:'24px',lineHeight:'1.6'}}>
          {reason==='expired'
            ? 'Masha Allah! Aapka learning session complete hua. Dobara seekhne ke liye ₹10 pay karen.'
            : 'As-salamu alaykum! NoorPath use karne ke liye ₹10 pay karen — 1 ghante ka full access milega.'}
        </div>
        <div style={{background:'var(--gp)',borderRadius:'16px',padding:'20px',marginBottom:'14px'}}>
          <div style={{fontSize:'42px',fontWeight:900,color:'var(--g)'}}>₹10</div>
          <div style={{fontSize:'13px',color:'var(--soft)',fontWeight:700}}>= 1 Hour Full Access</div>
        </div>
        <div style={{background:'linear-gradient(135deg,var(--night),#0f2d1a)',borderRadius:'12px',padding:'12px 16px',marginBottom:'20px',minHeight:'42px',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <div style={{color:'var(--gl)',fontSize:'12px',fontWeight:800,textAlign:'center',lineHeight:'1.4'}}>{hooks[hookIdx]}</div>
        </div>
        <div style={{textAlign:'left',background:'#FFF8E1',borderRadius:'14px',padding:'16px',marginBottom:'20px'}}>
          {['🕌 Arabic, Urdu, English Alphabets','🤲 All Daily Duas','🕋 5 Pillars + Prophet Stories','📿 99 Names of Allah','🤖 AI Islamic Tutor','🎯 Quiz & Games'].map((f,i)=>(
            <div key={i} style={{fontSize:'13px',color:'#7A5000',fontWeight:700,marginBottom:'6px'}}>{f}</div>
          ))}
        </div>
        <button onClick={startRazorpay} disabled={loading} style={{width:'100%',background:'linear-gradient(135deg,var(--gl),#E6A010)',color:'var(--night)',border:'none',borderRadius:'14px',padding:'16px',fontFamily:'Nunito',fontWeight:900,fontSize:'17px',cursor:'pointer',marginBottom:'10px',opacity:loading?0.6:1}}>
          {loading ? '⏳ Processing...' : '🔓 Pay ₹10 — Unlock 1 Hour'}
        </button>
        <div style={{fontSize:'12px',color:'var(--soft)',marginBottom:'10px'}}>UPI • Cards • Net Banking — sab Razorpay ke andar available hai</div>
        <div style={{fontSize:'11px',color:'var(--soft)',marginTop:'6px'}}>🔒 Access sirf verified payment ke baad milta hai • Powered by Razorpay</div>

        {!showAdminBox ? (
          <div style={{marginTop:'18px'}}>
            <button onClick={()=>setShowAdminBox(true)} style={{background:'none',border:'none',color:'#ccc',fontSize:'11px',cursor:'pointer',textDecoration:'underline'}}>Admin?</button>
          </div>
        ) : (
          <div style={{marginTop:'14px',background:'#f5f5f0',borderRadius:'12px',padding:'14px',textAlign:'left'}}>
            <div style={{fontSize:'12px',fontWeight:800,color:'var(--text)',marginBottom:'8px'}}>🔑 Admin PIN</div>
            <input
              type="password"
              value={adminPin}
              onChange={e=>{setAdminPin(e.target.value);setAdminError('')}}
              onKeyDown={e=>e.key==='Enter' && submitAdminPin()}
              placeholder="Enter PIN"
              style={{width:'100%',border:'2px solid #ddd',borderRadius:'10px',padding:'10px 12px',fontFamily:'Nunito',fontSize:'14px',marginBottom:'8px',outline:'none'}}
            />
            {adminError && <div style={{color:'#C62828',fontSize:'12px',fontWeight:700,marginBottom:'8px'}}>{adminError}</div>}
            <button onClick={submitAdminPin} style={{width:'100%',background:'var(--g)',color:'#fff',border:'none',borderRadius:'10px',padding:'10px',fontFamily:'Nunito',fontWeight:800,fontSize:'13px',cursor:'pointer'}}>Unlock</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ═══════ APP ROOT ═══════ */
function App(){
  const [user,setUser]=useState(()=>load('np_session',{name:'Student',child:'',email:'guest',plan:'free',progress:{},stars:0,time:0}));
  const [screen,setScreen]=useState('home');
  const [access,setAccess]=useState(()=>load('np_access',null));
  const [adminAccess,setAdminAccess]=useState(()=>{
    try{
      const raw = sessionStorage.getItem('np_admin_session');
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  });
  const [showWarning,setShowWarning]=useState(false);
  const [timeLeft,setTimeLeft]=useState(0);
  const [gateReason,setGateReason]=useState('first');

  // Check access validity every second (covers both paid hourly access and admin session)
  useEffect(()=>{
    const interval = setInterval(()=>{
      // Admin session (sessionStorage) — does not persist across browser restarts
      try{
        const rawAdmin = sessionStorage.getItem('np_admin_session');
        const admin = rawAdmin ? JSON.parse(rawAdmin) : null;
        if(admin && admin.expiresAt > Date.now()){
          setAdminAccess(admin);
        } else {
          if(admin) sessionStorage.removeItem('np_admin_session');
          setAdminAccess(null);
        }
      }catch(e){ setAdminAccess(null); }

      // Regular paid hourly access (localStorage)
      const current = load('np_access',null);
      if(current){
        const remaining = current.expiresAt - Date.now();
        if(remaining <= 0){
          save('np_access', null);
          setAccess(null);
          setGateReason('expired');
          setShowWarning(false);
        } else {
          setAccess(current);
          setTimeLeft(remaining);
          if(remaining <= 5*60*1000 && remaining > 0){
            setShowWarning(true);
          } else {
            setShowWarning(false);
          }
        }
      } else {
        setAccess(null);
      }
    }, 1000);
    return ()=>clearInterval(interval);
  },[]);

  function onProgress(mod,val){
    const updated={...user,progress:{...user.progress,[mod]:Math.max(user.progress?.[mod]||0,val)},stars:(user.stars||0)+1};
    save('np_session',updated);setUser(updated);
    if(typeof confetti !== 'undefined') {
      confetti({ particleCount: 30, angle: 60, spread: 55, origin: { x: 0, y: 0.85 } });
      confetti({ particleCount: 30, angle: 120, spread: 55, origin: { x: 1, y: 0.85 } });
    }
  }
  function navTo(s){ setScreen(s); }

  const isAdminSession = adminAccess && adminAccess.expiresAt > Date.now();
  const hasAccess = isAdminSession || (access && access.expiresAt > Date.now());

  if(!hasAccess){
    return <PayPerHourGate reason={gateReason} onUnlock={(session,isAdmin)=>{
      if(isAdmin){ setAdminAccess(session); }
      else { setAccess(session); }
      setGateReason('first');
      setScreen('home');
    }}/>;
  }

  function formatTime(ms){
    const totalSec = Math.max(0,Math.floor(ms/1000));
    const m = Math.floor(totalSec/60);
    const s = totalSec%60;
    return `${m}:${s.toString().padStart(2,'0')}`;
  }


  const navTabs=[
    {k:'home',l:'Home',icon:'home'},{k:'arabic',l:'Arabic',icon:'bookOpen'},{k:'urdu',l:'Urdu',icon:'book'},
    {k:'english',l:'English',icon:'globe'},{k:'duas',l:'Duas',icon:'heart'},{k:'ai',l:'AI',icon:'bot'},
  ];
  const back=()=>setScreen('home');
  const renderScreen=()=>{
    switch(screen){
      case 'arabic': return <ArabicMod onBack={back} onProgress={onProgress}/>;
      case 'urdu': return <UrduMod onBack={back} onProgress={onProgress}/>;
      case 'english': return <EnglishMod onBack={back} onProgress={onProgress}/>;
      case 'duas': return <DuasMod onBack={back} onProgress={onProgress}/>;
      case 'pillars': return <PillarsMod onBack={back}/>;
      case 'riyad': return <RiyadMod onBack={back}/>;
      case 'seerat': return <SeeratMod onBack={back}/>;
      case 'prophets': return <ProphetsMod onBack={back}/>;
      case 'names99': return <Names99Mod onBack={back}/>;
      case 'quran': return <QuranMod onBack={back}/>;
      case 'tajweed': return <TajweedMod onBack={back}/>;
      case 'fiqh': return <FiqhMod onBack={back}/>;
      case 'tasbeeh': return <TasbeehMod onBack={back}/>;
      case 'qibla': return <QiblaMod onBack={back}/>;
      case 'calendar': return <IslamicCalendarMod onBack={back}/>;
      case 'prayer': return <PrayerTimesMod onBack={back}/>;
      case 'recite': return <RecitationCheckerMod onBack={back}/>;
      case 'quiz': return <QuizMod onBack={back} onProgress={onProgress}/>;
      case 'ai': return <AITutor onBack={back} user={user}/>;
      case 'parent': return <ParentDash onBack={back} user={user}/>;
      default: return <Home user={user} onNav={navTo}/>;
    }
  };

  return(
    <>
      <nav className="nav">
        <a className="nav-logo" onClick={()=>setScreen('home')} href="#">
          <div className="nav-mark"><LIcon name="moon" size={22} color="var(--gl)"/></div>
          <div><div className="nav-text">NoorPath</div><div className="nav-sub">LEARN • GROW • FLOURISH</div></div>
        </a>
        <div className="nav-tabs">
          {navTabs.map(t=><button key={t.k} className={`nav-tab ${screen===t.k?'active':''}`} onClick={()=>navTo(t.k)}>
            <LIcon name={t.icon} size={16} color={screen===t.k?'var(--g)':'var(--soft)'}/>
            <span style={{fontSize:'10px',marginTop:'2px'}}>{t.l}</span>
          </button>)}
        </div>
        <div className="nav-right">
          {isAdminSession
            ? <button className="nav-btn nav-plan" style={{background:'#6B3FA0',color:'#fff',display:'flex',alignItems:'center',gap:'6px'}}><LIcon name="crown" size={14} color="#fff"/> ADMIN</button>
            : <button className="nav-btn nav-plan" style={{background: timeLeft<5*60*1000 ? '#ff6b6b' : 'var(--gl)',display:'flex',alignItems:'center',gap:'6px'}}><LIcon name="timer" size={14} color="#333"/> {formatTime(timeLeft)}</button>
          }
        </div>
      </nav>
      {showWarning && !isAdminSession && (
        <div style={{background:'linear-gradient(135deg,#ff6b6b,#e63946)',color:'#fff',padding:'12px 20px',textAlign:'center',fontWeight:800,fontSize:'13px',position:'sticky',top:'64px',zIndex:90}}>
          ⚠️ Sirf {formatTime(timeLeft)} minute bache hain! Time khatam hone par app lock ho jaayegi.
          <button onClick={()=>{save('np_access',null);setAccess(null);setGateReason('expired')}} style={{marginLeft:'12px',background:'#fff',color:'#e63946',border:'none',borderRadius:'8px',padding:'5px 12px',fontWeight:900,fontSize:'12px',cursor:'pointer'}}>🔄 Recharge Now</button>
        </div>
      )}
      {renderScreen()}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
